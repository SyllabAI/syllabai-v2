# EDITOR-DB-APPLY — migration 0028 apply runner (the ADR-044 editor planes:
# editor_grants — the grant row IS the role — plus editor_edit_proposals and
# editor_edit_receipts, docs/ADR-044-EDITOR_ROLE_CONTENT_WORKBENCH.md §3/§7).
# The Phase 1 EXIT CRITERION of record: the F5-S7 grants lane on the
# t-tier1-apply template verbatim (the teach_sessions 500 class proved the
# lesson at production cost — tables live, app role ungranted, production
# 500s).
#
# Executed behind the t-tier1-db-apply guard protocol of record:
#   job 1 (cow-apply): a disposable Neon COW branch off production (in-line
#     read_write endpoint, NEON_API_KEY = the CI key of record), branch-local
#     owner password reset (PRODUCTION ROLES NEVER TOUCHED), then the FROZEN
#     driver scripts/editor-apply-0028.ts applies the file as RAW SQL (one
#     transaction, lock_timeout=5s, idempotent preflight — an honest no-op
#     when the tables are already applied, fail-closed on any partial state),
#     post-verifies the full per-table invariant census (columns / PK /
#     FK-cascade / indexes incl. the partial-open unique grant index /
#     CHECKs / app-role grants) and proves the app role's verbs via
#     has_table_privilege (editor_grants + editor_edit_proposals: 4 DML
#     verbs; editor_edit_receipts: SELECT,INSERT ONLY — the append-only
#     receipts law) — THE PROOF OF RECORD is the driver receipt — then DROP
#     the COW + 404-verify, even on failure (if: always()).
#   job 2 (prod-apply, needs job 1 ALL GREEN, mode=cow+prod default): the
#     same frozen driver against the OWNER-CAPABLE production DSN of record
#     (SIB_PROD_DATABASE_URL), then the LIVE WIRE PROOF: a demo token probes
#     GET /api/v1/editor/me — 403 (grant-less demo account) is the EXPECTED
#     wire verdict while no grant row exists; a 404/500 is an honest red
#     (the router is not live). The driver is IDEMPOTENT: a re-run against
#     already-relaxed prod is an honest zero-DDL no-op, so a red receipt
#     after a partial state can be retried safely.
#
# OPERATOR GATE: workflow_dispatch ONLY — this runner is INERT until
# dispatched (the dispatch = the operator's fire order per the 093/133b law;
# the ADR-044 Phase 1 exit criterion completes when the operator fires it).
#
# RUN-006 (the run-005 red receipt honored): the enforcement-vantage ladder.
#   The run-004 diagnostics named the residual path (the app role is an
#   INHERIT member of neon_superuser — the Neon platform provisions
#   console/API-created roles into it); run-005 measured the ALTER refusal
#   from the owner vantage ("permission denied to alter role"). This runner
#   now provisions the enforcement-capable vantage for the COW leg (the
#   branch-local neon_superuser password reset — the branch dies at leg end,
#   production roles never touched) and gates the PROD credential mutation
#   behind the prod_superuser_reset input (deny default: a production
#   password reset is the operator's call, disclosed in the receipt when
#   allowed). The driver runs the flip PRE-SET-ROLE, so the connection
#   vantage of record is what enforces or honestly refuses.
# Secrets of record: NEON_API_KEY (exists), SIB_PROD_DATABASE_URL (exists,
# owner-capable). Vars of record: NEON_PROJECT_ID, NEON_PARENT_BRANCH_ID
# (exist). Receipts are scrubbed by construction: the driver records the DB
# host only, never URIs or tokens.

name: editor-db-apply-0028

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "cow+prod (default — full landing) | cow-only (COW proof first; prod only after the operator reviews the receipt)"
        required: false
        default: "cow+prod"
      note:
        description: "Operator note for this apply run"
        required: false
        default: ""
      app_role:
        description: "the app role the apply targets (default = the of-record syllabai_v2_app_w2r2; after the run-008 fork-option-2 cutover, dispatch with syllabai_v2_app_w3r3)"
        required: false
        default: "syllabai_v2_app_w2r2"
      prod_superuser_reset:
        description: "allow = the prod leg resets the PRODUCTION neon_superuser password via the Neon API (a production credential mutation, revertible, disclosed in the receipt) to gain the enforcement-capable vantage; deny = the staged SIB_PROD_DATABASE_URL vantage only (the enforcement ALTER is measured honestly and refused unless that DSN is enforcement-capable)"
        required: false
        default: "deny"

permissions:
  contents: read

concurrency:
  group: editor-db-apply-0028
  cancel-in-progress: false

jobs:
  cow-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install workspace deps (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Create COW branch (in-line read_write endpoint)
        id: cow
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_PARENT_BRANCH_ID: ${{ vars.NEON_PARENT_BRANCH_ID }}
        run: |
          set -euo pipefail
          NAME="editor-0028-cow-${GITHUB_RUN_ID}"
          RESP=$(curl -sf -X POST "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches" \
            -H "Authorization: Bearer ${NEON_API_KEY}" -H "Content-Type: application/json" \
            -d "{\"branch\":{\"parent_id\":\"${NEON_PARENT_BRANCH_ID}\",\"name\":\"${NAME}\"},\"endpoints\":[{\"type\":\"read_write\"}]}")
          BRANCH_ID=$(echo "$RESP" | jq -r '.branch.id')
          echo "branch_id=${BRANCH_ID}" >> "$GITHUB_OUTPUT"
          HOST=""
          for i in $(seq 1 60); do
            EP=$(curl -sf "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${BRANCH_ID}/endpoints" \
              -H "Authorization: Bearer ${NEON_API_KEY}")
            HOST=$(echo "$EP" | jq -r '.endpoints[0].host // empty')
            STATE=$(echo "$EP" | jq -r '.endpoints[0].current_state // empty')
            # run-008 rehearsal finding (2026-11-13): the endpoints API now
          # reports the COW lifecycle as init -> active with no 'ready' state
          # observed in 270s of polling — accept both (behavior-preserving if
          # 'ready' reappears; the 2026-11-12 run-007 still saw 'ready').
          if [ -n "$HOST" ] && { [ "$STATE" = "ready" ] || [ "$STATE" = "active" ]; }; then break; fi
            sleep 3
          done
          [ -n "$HOST" ] || { echo "endpoint never ready"; exit 1; }
          echo "host=${HOST}" >> "$GITHUB_OUTPUT"
      - name: Reset BRANCH-LOCAL owner password (production roles untouched; 423-aware)
        id: role
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail
          PW=""
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /tmp/e28-reset.json -w "%{http_code}" \
              -X POST "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${{ steps.cow.outputs.branch_id }}/roles/neondb_owner/reset_password" \
              -H "Authorization: Bearer ${NEON_API_KEY}")
            if [ "$CODE" = "200" ]; then
              PW=$(jq -r '.role.password' /tmp/e28-reset.json)
              break
            fi
            if [ "$CODE" = "423" ]; then sleep 5; continue; fi
            echo "unexpected reset status ${CODE}"; exit 1
          done
          [ -n "$PW" ] || { echo "no password in reset response"; exit 1; }
          ENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1], safe=''))" "$PW")
          echo "cow_url=postgresql://neondb_owner:${ENC}@${{ steps.cow.outputs.host }}/neondb?sslmode=require" >> "$GITHUB_OUTPUT"
      - name: Reset BRANCH-LOCAL neon_superuser password (run-006 enforcement vantage; the branch dies at leg end)
        id: sul
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail
          PW=""
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /tmp/e28-su-reset.json -w "%{http_code}" \
              -X POST "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${{ steps.cow.outputs.branch_id }}/roles/neon_superuser/reset_password" \
              -H "Authorization: Bearer ${NEON_API_KEY}")
            if [ "$CODE" = "200" ]; then PW=$(jq -r '.role.password' /tmp/e28-su-reset.json); break; fi
            if [ "$CODE" = "423" ]; then sleep 5; continue; fi
            echo "neon_superuser reset not permitted on this project (HTTP ${CODE}) — the leg continues on the owner vantage and the receipt measures the refusal honestly"; break
          done
          if [ -n "$PW" ]; then
            ENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1], safe=''))" "$PW")
            echo "su_available=true" >> "$GITHUB_OUTPUT"
            echo "su_url=postgresql://neon_superuser:${ENC}@${{ steps.cow.outputs.host }}/neondb?sslmode=require" >> "$GITHUB_OUTPUT"
          else
            echo "su_available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply 0028 + post-verify on the COW (frozen driver, idempotent)
        env:
          EDITOR_APP_ROLE: ${{ inputs.app_role }}
        run: |
          if [ "${{ steps.sul.outputs.su_available }}" = "true" ]; then
            printf '%s' "${{ steps.sul.outputs.su_url }}" > /tmp/e28-cow.uri
            echo "apply vantage: neon_superuser (run-006 enforcement-capable)"
          else
            printf '%s' "${{ steps.role.outputs.cow_url }}" > /tmp/e28-cow.uri
            echo "apply vantage: neondb_owner (enforcement will measure the refusal honestly)"
          fi
          chmod 600 /tmp/e28-cow.uri
          bun scripts/editor-apply-0028.ts --db file:/tmp/e28-cow.uri --receipt cow-editor-0028-receipt.json
      - name: CREATE-ROLE viability probe (run-006 fork evidence; COW-only, zero prod contact)
        if: always()
        run: |
          printf '%s' "${{ steps.role.outputs.cow_url }}" > /tmp/e28-probe.uri
          chmod 600 /tmp/e28-probe.uri
          bun scripts/editor-probe-role.ts --db file:/tmp/e28-probe.uri --receipt cow-editor-0028-probe.json
      - name: Upload the receipt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-0028-cow-receipts
          path: |
            cow-editor-0028-receipt.json
            cow-editor-0028-probe.json
          if-no-files-found: ignore
      - name: DROP the COW + 404-verify (zero residue, even on failure)
        if: always()
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail
          BRANCH_ID="${{ steps.cow.outputs.branch_id }}"
          [ -n "$BRANCH_ID" ] || { echo "no branch to drop"; exit 0; }
          curl -sf -X DELETE "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${BRANCH_ID}" \
            -H "Authorization: Bearer ${NEON_API_KEY}" > /dev/null || true
          sleep 5
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${BRANCH_ID}" \
            -H "Authorization: Bearer ${NEON_API_KEY}")
          echo "post-delete GET = ${CODE}"
          [ "$CODE" = "404" ] || { echo "COW residue — 404 verification FAILED"; exit 1; }

  prod-apply:
    needs: cow-apply
    if: ${{ inputs.mode == 'cow+prod' && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install workspace deps (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Stage the prod vantage (staged DSN of record; optional operator-gated superuser reset)
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_PARENT_BRANCH_ID: ${{ vars.NEON_PARENT_BRANCH_ID }}
          SIB_PROD_DATABASE_URL: ${{ secrets.SIB_PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          [ -n "$SIB_PROD_DATABASE_URL" ] || { echo "SIB_PROD_DATABASE_URL not staged — abort"; exit 2; }
          if [ "${{ inputs.prod_superuser_reset }}" = "allow" ]; then
            echo "OPERATOR-GATED prod credential mutation: resetting the PRODUCTION neon_superuser password (revertible; nobody is known to connect as it; disclosed in the receipt)"
            HOST=$(python3 -c "import urllib.parse,sys;u=urllib.parse.urlparse(sys.argv[1]);print(u.hostname or '')" "$SIB_PROD_DATABASE_URL")
            [ -n "$HOST" ] || { echo "cannot parse the staged DSN host"; exit 2; }
            PW=""
            for i in $(seq 1 20); do
              CODE=$(curl -s -o /tmp/e28-prod-su.json -w "%{http_code}" \
                -X POST "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${NEON_PARENT_BRANCH_ID}/roles/neon_superuser/reset_password" \
                -H "Authorization: Bearer ${NEON_API_KEY}")
              if [ "$CODE" = "200" ]; then PW=$(jq -r '.role.password' /tmp/e28-prod-su.json); break; fi
              if [ "$CODE" = "423" ]; then sleep 5; continue; fi
              echo "prod neon_superuser reset refused (HTTP ${CODE}) — falling back to the staged DSN vantage"; break
            done
            if [ -n "$PW" ]; then
              ENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1], safe=''))" "$PW")
              printf 'postgresql://neon_superuser:%s@%s/neondb?sslmode=require' "$ENC" "$HOST" > /tmp/e28-prod.uri
              echo "prod vantage: neon_superuser (enforcement-capable)"
            else
              printf '%s' "$SIB_PROD_DATABASE_URL" > /tmp/e28-prod.uri
              echo "prod vantage: staged DSN (the enforcement ALTER will be measured honestly)"
            fi
          else
            printf '%s' "$SIB_PROD_DATABASE_URL" > /tmp/e28-prod.uri
            echo "prod vantage: staged DSN (prod_superuser_reset=deny — the enforcement ALTER will be measured honestly)"
          fi
          chmod 600 /tmp/e28-prod.uri
      - name: Apply 0028 against PRODUCTION (frozen driver — preflight / apply / post-verify, idempotent)
        env:
          EDITOR_APP_ROLE: ${{ inputs.app_role }}
        run: |
          set -euo pipefail
          [ -s /tmp/e28-prod.uri ] || { echo "prod URI not staged — abort"; exit 2; }
          bun scripts/editor-apply-0028.ts --db file:/tmp/e28-prod.uri --receipt prod-editor-0028-receipt.json
      - name: LIVE WIRE PROOF (GET /editor/me — 403 is the expected grant-less verdict)
        run: |
          set -euo pipefail
          API="https://syllabai-v2.vercel.app/api/v1"
          WEB="https://www.syllab-ai.com"
          STUDENT=$(curl -sf "${WEB}/api/demo/login?role=student" | jq -r '.accessToken')
          [ -n "$STUDENT" ] && [ "$STUDENT" != "null" ] || { echo "demo student mint failed"; exit 1; }
          CODE=$(curl -s -o /tmp/e28-probe.json -w "%{http_code}" -H "Authorization: Bearer $STUDENT" "${API}/editor/me")
          echo "GET /editor/me (grant-less demo) → HTTP ${CODE}"
          if [ "$CODE" = "403" ]; then
            echo "WIRE PROOF: the editor router is live and correctly refuses a grant-less account"
          elif [ "$CODE" = "401" ]; then
            echo "WIRE PROOF: the editor shell answered (auth envelope); grant verdict rides the grant rows"
          else
            echo "body: $(head -c 300 /tmp/e28-probe.json)"
            echo "WIRE PROOF FAILED — expected 401/403 (grant-less), got ${CODE}"
            exit 1
          fi
      - name: Upload the receipt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-0028-prod-receipts
          path: prod-editor-0028-receipt.json
          if-no-files-found: ignore
