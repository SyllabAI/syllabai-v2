# T-WIREFIX-1 — migrations 0017/0018/0019/0027 apply runner (the missing
# mark-parity planes the DEPLOYED hub+api wire already serves: mark_point_rects
# (0017), mark_awards + mark_working_blocks (0018), learner_pdf_drawings (0019),
# the mark_awards attempt_class/cache_hash delta (0027) — wire-probed 500 on
# production 2026-11-06: paper-marks ×90 per Past Papers page load, the DC-7
# progress/plan-projection rollups, the learner pdf-drawings plane).
#
# Executed behind the t-tier1-db-apply-0022-0023-0026 guard protocol of record
# (plan of record: docs/T-WIREFIX-1-PLAN.md):
#   job 1 (cow-apply): a disposable Neon COW branch off production (in-line
#     read_write endpoint, NEON_API_KEY = the CI key of record), branch-local
#     owner password reset (PRODUCTION ROLES NEVER TOUCHED), then the FROZEN
#     driver scripts/t-wirefix-apply-0017-0018-0019-0027.ts applies the four
#     files as RAW SQL (one transaction PER FILE, lock_timeout=5s, idempotent
#     preflight per file — honest no-op when a file's objects are already
#     applied, fail-closed on any partial state), post-verifies the full
#     per-table invariant census (columns / PK / FK posture incl. the
#     deliberate NO-ACTION ledger FK / indexes / CHECKs / app-role DML grants)
#     and proves the app role can SELECT/INSERT/UPDATE/DELETE all four tables
#     (has_table_privilege, no impersonation) — THE PROOF OF RECORD is the
#     driver receipt — then DROP the COW + 404-verify, even on failure
#     (if: always(), the T-MIG-035 discipline). Production roles are never
#     touched.
#   job 2 (prod-apply, needs job 1 ALL GREEN, mode=cow+prod default): the
#     same frozen driver against the OWNER-CAPABLE production DSN of record
#     (SIB_PROD_DATABASE_URL — the exact secret the t-tier1 prod leg used),
#     then the LIVE WIRE PROOF: the runner mints the demo student token
#     through the production demo contract and re-probes the four endpoints
#     that were live-probed 500 before this lane (paper-marks, the DC-7
#     progress + plan-projection rollups, learner pdf-drawings — all must be
#     200; a 500 after a green DDL apply = honest red). The driver is
#     IDEMPOTENT: a re-run against already-relaxed prod is an honest
#     zero-DDL no-op, so a red receipt after a partial state can be retried
#     safely.
#
# OPERATOR GATE: workflow_dispatch ONLY — this runner is INERT until
# dispatched (the dispatch = the operator's fire order per the 093/133b law).
# Secrets of record: NEON_API_KEY (exists), SIB_PROD_DATABASE_URL (exists,
# owner-capable — same pair the tier1 lane used on 2026-11-05). Vars of
# record: NEON_PROJECT_ID, NEON_PARENT_BRANCH_ID (exist). Receipts are
# scrubbed by construction: the driver records the DB host only, never URIs
# or tokens.

name: t-wirefix-db-apply-0017-0018-0019-0027

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "cow+prod (default — full landing) | cow-only (COW proof first; prod only after the operator reviews the receipt)"
        required: false
        default: "cow+prod"
      note:
        description: "Operator note for this apply run"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: t-wirefix-db-apply-0017-0018-0019-0027
  cancel-in-progress: false

jobs:
  cow-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install workspace deps (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Create COW branch (in-line read_write endpoint)
        id: cow
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_PARENT_BRANCH_ID: ${{ vars.NEON_PARENT_BRANCH_ID }}
        run: |
          set -euo pipefail
          NAME="t-wirefix-cow-${GITHUB_RUN_ID}"
          RESP=$(curl -sf -X POST "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches" \
            -H "Authorization: Bearer ${NEON_API_KEY}" -H "Content-Type: application/json" \
            -d "{\"branch\":{\"parent_id\":\"${NEON_PARENT_BRANCH_ID}\",\"name\":\"${NAME}\"},\"endpoints\":[{\"type\":\"read_write\"}]}")
          BRANCH_ID=$(echo "$RESP" | jq -r '.branch.id')
          echo "branch_id=${BRANCH_ID}" >> "$GITHUB_OUTPUT"
          HOST=""
          for i in $(seq 1 60); do
            EP=$(curl -sf "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${BRANCH_ID}/endpoints" \
              -H "Authorization: Bearer ${NEON_API_KEY}")
            HOST=$(echo "$EP" | jq -r '.endpoints[0].host // empty')
            STATE=$(echo "$EP" | jq -r '.endpoints[0].current_state // empty')
            if [ -n "$HOST" ] && [ "$STATE" = "ready" ]; then break; fi
            sleep 3
          done
          [ -n "$HOST" ] || { echo "endpoint never ready"; exit 1; }
          echo "host=${HOST}" >> "$GITHUB_OUTPUT"
      - name: Reset BRANCH-LOCAL owner password (production roles untouched; 423-aware)
        id: role
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail
          PW=""
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /tmp/wf-reset.json -w "%{http_code}" \
              -X POST "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${{ steps.cow.outputs.branch_id }}/roles/neondb_owner/reset_password" \
              -H "Authorization: Bearer ${NEON_API_KEY}")
            if [ "$CODE" = "200" ]; then
              PW=$(jq -r '.role.password' /tmp/wf-reset.json)
              break
            fi
            if [ "$CODE" = "423" ]; then sleep 5; continue; fi
            echo "unexpected reset status ${CODE}"; exit 1
          done
          [ -n "$PW" ] || { echo "no password in reset response"; exit 1; }
          ENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1], safe=''))" "$PW")
          echo "cow_url=postgresql://neondb_owner:${ENC}@${{ steps.cow.outputs.host }}/neondb?sslmode=require" >> "$GITHUB_OUTPUT"
      - name: Apply 0017→0018→0019→0027 + post-verify on the COW (frozen driver, idempotent)
        run: |
          printf '%s' "${{ steps.role.outputs.cow_url }}" > /tmp/wf-cow.uri
          chmod 600 /tmp/wf-cow.uri
          bun scripts/t-wirefix-apply-0017-0018-0019-0027.ts --db file:/tmp/wf-cow.uri --receipt cow-wirefix-receipt.json
      - name: Upload the receipt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wirefix-cow-receipts
          path: cow-wirefix-receipt.json
          if-no-files-found: ignore
      - name: DROP the COW + 404-verify (zero residue, even on failure)
        if: always()
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail
          BRANCH_ID="${{ steps.cow.outputs.branch_id }}"
          [ -n "$BRANCH_ID" ] || { echo "no branch to drop"; exit 0; }
          curl -sf -X DELETE "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${BRANCH_ID}" \
            -H "Authorization: Bearer ${NEON_API_KEY}" > /dev/null || true
          sleep 5
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${BRANCH_ID}" \
            -H "Authorization: Bearer ${NEON_API_KEY}")
          echo "post-delete GET = ${CODE}"
          [ "$CODE" = "404" ] || { echo "COW residue — 404 verification FAILED"; exit 1; }

  prod-apply:
    needs: cow-apply
    if: ${{ inputs.mode == 'cow+prod' && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install workspace deps (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Apply 0017→0018→0019→0027 against PRODUCTION (frozen driver — preflight / apply / post-verify, idempotent)
        env:
          SIB_PROD_DATABASE_URL: ${{ secrets.SIB_PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          [ -n "$SIB_PROD_DATABASE_URL" ] || { echo "SIB_PROD_DATABASE_URL not staged — abort"; exit 2; }
          printf '%s' "$SIB_PROD_DATABASE_URL" > /tmp/wf-prod.uri
          chmod 600 /tmp/wf-prod.uri
          bun scripts/t-wirefix-apply-0017-0018-0019-0027.ts --db file:/tmp/wf-prod.uri --receipt prod-wirefix-receipt.json
      - name: LIVE WIRE PROOF (the four endpoints that were 500 before this lane)
        run: |
          set -euo pipefail
          API="https://syllabai-v2-six.vercel.app/api/v1"
          WEB="https://www.syllab-ai.com"
          STUDENT=$(curl -sf "${WEB}/api/demo/login?role=student" | jq -r '.accessToken')
          [ -n "$STUDENT" ] && [ "$STUDENT" != "null" ] || { echo "demo student mint failed"; exit 1; }
          DOC_REF=$(curl -sf -H "Authorization: Bearer $STUDENT" "${API}/paper-assets/resolve?paperCode=4CH1%2F1C&sessionLabel=June%202026" | jq -r '.paperId')
          [ -n "$DOC_REF" ] && [ "$DOC_REF" != "null" ] || { echo "paper-assets/resolve mint failed"; exit 1; }
          probe() { # probe <label> <path>
            local CODE=$(curl -s -o /tmp/wf-probe.json -w "%{http_code}" -H "Authorization: Bearer $STUDENT" "${API}$2")
            echo "$1 → HTTP ${CODE}"
            if [ "$CODE" != "200" ]; then echo "body: $(head -c 300 /tmp/wf-probe.json)"; return 1; fi
          }
          probe "GET /paper-marks?documentRefType=paper_asset&documentRefId=${DOC_REF}" \
            "/paper-marks?documentRefType=paper_asset&documentRefId=${DOC_REF}"
          probe "GET /learners/me/progress?course=igcse-chemistry-19" \
            "/learners/me/progress?course=igcse-chemistry-19"
          probe "GET /learners/me/plan-projection?course=igcse-chemistry-19" \
            "/learners/me/plan-projection?course=igcse-chemistry-19"
          probe "GET /learner/pdf-drawings?documentRefType=paper_asset&documentRefId=${DOC_REF}" \
            "/learner/pdf-drawings?documentRefType=paper_asset&documentRefId=${DOC_REF}"
          echo "WIRE PROOF: all four previously-500 endpoints now 200"
      - name: Upload the receipt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wirefix-prod-receipts
          path: prod-wirefix-receipt.json
          if-no-files-found: ignore
