name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # T-MIG-000: single root install from the committed root bun.lock
      # (hub is now a first-class workspace package — @syllabai/hub).
      - name: Install workspace deps (root lockfile, all workspaces)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test apps/api packages

      - name: Golden-master self-check (harness sanity, no live target)
        run: bun golden/runner.ts --selftest

  hub:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace deps (root lockfile, all workspaces)
        run: bun install --frozen-lockfile

      # Corpus prebuild verify (verify_corpus_23a + flashcard-sync checks)
      # then the full Next.js production build incl. standalone assembly.
      - name: Build hub (prebuild corpus verify + next build)
        run: bun run --cwd apps/hub build
