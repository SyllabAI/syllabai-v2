name: ci

on:
  push:
    # T-MIG-076: this literal was corrupted to 'branches: ain]' at T-MIG-000
    # (matches no real branch, so push-triggered verify+hub on main never fired -
    # the plausible root cause of the recurring event-drop class, masked by the
    # pull_request triggers); restored 2026-10-06 run-003 via the API channel
    branches: [main]
  pull_request:
  # T-GATE-PROTECT-1 (operator directive, zai-web trace 1a1d4c8d1aae1e11):
  # required for the merge queue (main ruleset 'no-unverified-landings').
  # Without this trigger, verify+hub never report on merge-queue entries
  # and every queued merge stalls until the entry times out.
  merge_group:
  workflow_dispatch:

# T-TURBO-CACHE run-001: id-token:write is required for the OIDC exchange in
# vercel/setup-turborepo-remote-cache-action (short-lived remote-cache token,
# revoked at job end). contents:read is the minimal checkout scope. Safe even
# when the cache step is skipped (no TURBO_TEAM variable configured).
permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # T-MIG-000: one unified workspace install from the root lockfile.
      # Per-directory installs were superseded when the hub became a
      # first-class bun workspace package (root bun.lock + bunfig.toml).
      - name: Install workspace deps (root lockfile, all workspaces)
        run: bun install --frozen-lockfile

      # T-TURBO-CACHE run-001: short-lived OIDC remote-cache token (no stored
      # secret, auto-revoked at job end). Skips cleanly when the TURBO_TEAM
      # repo variable is absent — turbo then falls back to the local cache
      # and CI stays green either way. One-time enablement: Vercel team
      # Settings → Build and Deployment → OIDC Policies for CLI Access, then
      # `gh variable set TURBO_TEAM --body "<team-slug>"`.
      - name: Turborepo remote cache token (OIDC, short-lived)
        if: ${{ vars.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test apps/api packages

      - name: Golden-master self-check (harness sanity, no live target)
        run: bun golden/runner.ts --selftest

      # Card C (retrieval-eval): the fusion-layer eval harness — REAL rrf.ts
      # fusion, recorded EMBED_REV 2 fixture vectors, labels from the
      # question_topics anchoring, weights-vs-uniform ablation. Provider-free
      # by construction (no embedding provider, no database).
      - name: Retrieval eval harness (fusion ablation, provider-free)
        run: bun test golden/retrieval-eval && bun run --cwd golden/retrieval-eval selftest

      # T-MIG-123 §Z conversion — the zero-core census GATE: the LIVE=0 act of
      # record (operator retirement order trace 1a131d02c805602d; the 48h soak
      # waived by the same order). Exit 0 iff live=0 AND unmapped=0 AND
      # stale-hints=0 AND unknown-route=0. Any regression that re-introduces a
      # LIVE core-family call fails CI here instead of silently riding Render.
      - name: Zero-core census gate (LIVE=0 law, §Z)
        run: python3 scripts/preflight_zero_core_census.py --gate

  # T-MIG-000: hub lane — the 153MB corpus + Next build live in their own
  # job so the fast verify lane stays fast. The prebuild corpus-verify
  # scripts (verify_corpus_23a.ts, verify_flashcard_sync_courses.ts) run as
  # part of `bun run build:hub`, so a corrupted corpus fails this lane.
  hub:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace deps (root lockfile, all workspaces)
        run: bun install --frozen-lockfile

      # T-TURBO-CACHE run-001: same OIDC remote-cache token as the verify job
      # (skipped when TURBO_TEAM is unset; local cache only in that case).
      # build:hub is now turbo-orchestrated — cached when src/content/next
      # config inputs are unchanged, with .next/** (standalone incl.) and
      # public/corpus-index.json restored from cache instead of rebuilt.
      - name: Turborepo remote cache token (OIDC, short-lived)
        if: ${{ vars.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Build hub (corpus-verify prebuild + next build)
        run: bun run build:hub

      # T-KG-FIX-1 (F3): the KG corpus data contract as CI law — per-graph
      # spanning-tree integrity plus registry <-> data <-> index parity and the
      # orphan law over public/kg/data. Scoped to this one file on purpose:
      # hub src/lib carries pre-existing UGM-lane baseline failures elsewhere.
      - name: KG corpus integrity laws (T-KG-FIX-1)
        run: bun test apps/hub/src/lib/kg-corpus.test.ts

      # T-KG-TRIPWIRE-1 run-003: Phase 1 T1 acceptance as CI law — the
      # feedback schema/aggregation law of record + the renderer-fork contract
      # (constants cannot drift, zero new network calls, prereqValidated
      # payload law untouched).
      - name: KG T1 feedback schema + fork contract (T-KG-TRIPWIRE-1)
        run: bun test apps/hub/src/lib/kg-prereq-feedback.test.ts
