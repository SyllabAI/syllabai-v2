name: ci

on:
  push:
    # T-MIG-076: this literal was corrupted to 'branches: ain]' at T-MIG-000
    # (matches no real branch, so push-triggered verify+hub on main never fired -
    # the plausible root cause of the recurring event-drop class, masked by the
    # pull_request triggers); restored 2026-10-06 run-003 via the API channel
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # T-MIG-000: one unified workspace install from the root lockfile.
      # Per-directory installs were superseded when the hub became a
      # first-class bun workspace package (root bun.lock + bunfig.toml).
      - name: Install workspace deps (root lockfile, all workspaces)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test apps/api packages

      - name: Golden-master self-check (harness sanity, no live target)
        run: bun golden/runner.ts --selftest

      # Card C (retrieval-eval): the fusion-layer eval harness — REAL rrf.ts
      # fusion, recorded EMBED_REV 2 fixture vectors, labels from the
      # question_topics anchoring, weights-vs-uniform ablation. Provider-free
      # by construction (no embedding provider, no database).
      - name: Retrieval eval harness (fusion ablation, provider-free)
        run: bun test golden/retrieval-eval && bun run --cwd golden/retrieval-eval selftest

      # T-MIG-123 §Z conversion — the zero-core census GATE: the LIVE=0 act of
      # record (operator retirement order trace 1a131d02c805602d; the 48h soak
      # waived by the same order). Exit 0 iff live=0 AND unmapped=0 AND
      # stale-hints=0 AND unknown-route=0. Any regression that re-introduces a
      # LIVE core-family call fails CI here instead of silently riding Render.
      - name: Zero-core census gate (LIVE=0 law, §Z)
        run: python3 scripts/preflight_zero_core_census.py --gate

  # T-MIG-000: hub lane — the 153MB corpus + Next build live in their own
  # job so the fast verify lane stays fast. The prebuild corpus-verify
  # scripts (verify_corpus_23a.ts, verify_flashcard_sync_courses.ts) run as
  # part of `bun run build:hub`, so a corrupted corpus fails this lane.
  hub:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace deps (root lockfile, all workspaces)
        run: bun install --frozen-lockfile

      - name: Build hub (corpus-verify prebuild + next build)
        run: bun run build:hub
