# T-VERCEL-ACCOUNT-DIAG run-001 — the account-migration verification lane.
#
# CONTEXT (2026-11-13): production of record moved to a SECOND Vercel
# account after the OLD account went usage-blocked (the Nov 5 bake
# failure — "why is my account deployment blocked"). The user asks what
# the migration actually covers TODAY. This workflow answers it with
# READ-ONLY GETs only:
#   (1) the team of record (id/slug/plan-ish fields the token may see),
#   (2) per project: the git link (which repo/connection), every attached
#       domain with its VERIFIED flag (verified=true ⇒ DNS points at THIS
#       account — the authoritative ownership signal), the last 8
#       production deployments (what this account actually built), and
#       the env-var NAME inventory (names only — the SECRET law).
# Everything else (DNS edge checks, content hashes) runs locally in the
# operator sandbox; this lane is the Vercel-side half.

name: t-vercel-account-diag

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Enumerate team, projects, domains, deployments, env names (READ-ONLY GETs)
        env:
          VERCEL_BAKE_TOKEN: ${{ secrets.VERCEL_BAKE_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          def vapi(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + os.environ["VERCEL_BAKE_TOKEN"],
                  "Accept": "application/json", "User-Agent": "t-vercel-account-diag/1"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())

          teams = vapi("https://api.vercel.com/v2/teams").get("teams", [])
          print(f"TEAMS visible to the token: {len(teams)}")
          for t in teams:
              print(f"  TEAM {t.get('id')} slug={t.get('slug')} name={(t.get('name') or '')[:48]}")
              for k in ("plan", "createdAt", "ssoConnected", "inviteCode"):
                  if k in t and t[k] not in (None, ""):
                      print(f"    team.{k} = {t[k]}")

          projects = vapi("https://api.vercel.com/v9/projects?limit=100").get("projects", [])
          print(f"\nPROJECTS on the token's scope: {len(projects)}")
          for p in projects:
              pid, name = p.get("id"), p.get("name")
              link = p.get("link") or {}
              print(f"\nPROJECT {name} | id {pid} | rootDirectory {p.get('rootDirectory') or '(repo root)'} | createdAt {p.get('createdAt')}")
              print(f"    git link: type={link.get('type')} repo={link.get('repo') or '(none)'} prodBranch={link.get('productionBranch') or '(default)'}")
              try:
                  dd = vapi(f"https://api.vercel.com/v9/projects/{pid}/domains").get("domains", [])
                  for d in dd:
                      print(f"    DOMAIN {d.get('name')} verified={d.get('verified')} redirect={(d.get('redirect') or '')[:40]} createdAt={d.get('createdAt')}")
              except Exception as e:
                  print(f"    domains probe failed: {type(e).__name__} {str(e)[:120]}")
              try:
                  ds = vapi(f"https://api.vercel.com/v6/deployments?projectId={pid}&target=production&limit=8").get("deployments", [])
                  print(f"    last {len(ds)} prod deployments:")
                  for d in ds:
                      meta = d.get("meta") or {}
                      extra = {k: str(d[k])[:60] for k in ("canceledAt", "errorMessage", "forbidden") if d.get(k)}
                      print(f"      {d.get('uid')} {d.get('state')} sha={(meta.get('githubCommitSha') or '(manual)')[:10]} created={d.get('createdAt')} aliasAssigned={str(d.get('aliasAssigned'))[:24]}" + (f" extra={extra}" if extra else ""))
              except Exception as e:
                  print(f"    deployments probe failed: {type(e).__name__} {str(e)[:120]}")
              try:
                  envs = vapi(f"https://api.vercel.com/v9/projects/{pid}/env?limit=100").get("envs", [])
                  keys = sorted({e.get("key", "") for e in envs})
                  print(f"    ENV names ({len(envs)}): {', '.join(keys) if keys else '(none)'}")
              except Exception as e:
                  print(f"    env probe failed: {type(e).__name__} {str(e)[:120]}")
          PY
