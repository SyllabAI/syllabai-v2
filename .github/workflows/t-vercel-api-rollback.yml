# T-VERCEL-API-ROLLBACK run-002 — Hobby-plan law: only the PREVIOUS production
# deployment can be promoted (run-001 receipt: "To rollback further than the
# previous production deployment, upgrade to pro. (402)").
#
# Strategy: print the full production deployment list (uid / state / created /
# url / meta sha) for the record, then target EXACTLY the second entry
# (newest-first) — Vercel's "previous production deployment". If that entry is
# itself from the empty-bake era (>= 2026-11-10 00:00Z — a second scheduled
# bake), the printed state makes it visible and the workflow refuses.
#
# Serving probe after promotion: /api/v1/auth/login must answer a JSON 400
# (the app), not Vercel's NOT_FOUND page (the empty deployment).

name: t-vercel-api-rollback

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Print the production deployment list and pick the previous one
        id: target
        env:
          VERCEL_BAKE_TOKEN: ${{ secrets.VERCEL_BAKE_TOKEN }}
          PROJECT_ID: prj_vf1MQaCuuGHd83HaTA3uqDxETpb5
        run: |
          curl -sSf -H "Authorization: Bearer $VERCEL_BAKE_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$PROJECT_ID&target=production&limit=10" \
            | python3 -c "
          import json, os, sys, datetime
          deps = json.load(sys.stdin).get('deployments', [])
          print('PRODUCTION DEPLOYMENTS (newest first):')
          for i, d in enumerate(deps):
              ts = datetime.datetime.utcfromtimestamp(d.get('createdAt', 0) / 1000).isoformat()
              print(f\"  [{i}] {d.get('uid')} | {d.get('state')} | {ts} | {d.get('url')} | sha {(d.get('meta') or {}).get('githubCommitSha', '(none)')[:10]}\")
          if len(deps) < 2:
              print('fewer than two production deployments — refusing')
              sys.exit(1)
          prev = deps[1]
          if prev.get('createdAt', 0) >= 1794153600000:
              print('REFUSING: the previous deployment is itself from the empty-bake era')
              sys.exit(1)
          if prev.get('state') != 'READY':
              print('REFUSING: the previous deployment is not READY:', prev.get('state'))
              sys.exit(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('uid=' + prev.get('uid', '') + chr(10) + 'url=' + prev.get('url', '') + chr(10))
          print('promoting (previous production deployment):', prev.get('uid'), prev.get('url'))
          "

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Promote the previous production deployment (instant rollback)
        env:
          VERCEL_BAKE_TOKEN: ${{ secrets.VERCEL_BAKE_TOKEN }}
          TARGET_URL: ${{ steps.target.outputs.url }}
        run: vercel rollback "$TARGET_URL" --yes --token="$VERCEL_BAKE_TOKEN"
        shell: bash

      - name: Serving proof (read-only probe)
        run: |
          sleep 10
          echo "--- /api/v1/auth/login (expect JSON 400, not the Vercel NOT_FOUND page) ---"
          curl -s -w "\nHTTP %{http_code}\n" -X POST -H "Content-Type: application/json" -d '{}' https://api.syllab-ai.com/api/v1/auth/login | head -c 300
