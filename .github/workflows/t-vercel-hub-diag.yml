# T-VERCEL-HUB-DIAG run-001 — why did the git-connected hub deploy fail?
#
# CONTEXT: PR #922 merged (the ink toolbar fold + browse-first gestures); the
# git-connected production deploy of syllabai-hub-v2 on the merge commit
# (7ad9b451ff) FAILED ("Vercel – syllabai-hub-v2 | failure, 2026-11-11
# 11:07:13Z") while CI's hub check passed — so production is still serving the
# pre-#922 build and the operator's viewer is still broken live.
#
# THIS WORKFLOW (read-only): list the hub project's recent production
# deployments, find the newest non-READY one, and print its build events —
# the error lines verbatim, no secrets (the VERCEL_BAKE_TOKEN is never
# printed).

name: t-vercel-hub-diag

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Pull the failed hub deployment's build events (read-only)
        env:
          VERCEL_BAKE_TOKEN: ${{ secrets.VERCEL_BAKE_TOKEN }}
          HUB_PROJECT_ID: prj_idqk5yM3leODE1Rmm2pPNKxy2x6m
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          tok = os.environ["VERCEL_BAKE_TOKEN"]
          pid = os.environ["HUB_PROJECT_ID"]

          def vapi(url):
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {tok}"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          deps = vapi(f"https://api.vercel.com/v6/deployments?projectId={pid}&target=production&limit=6").get("deployments", [])
          print("HUB PRODUCTION DEPLOYMENTS (newest first):")
          failed = None
          for d in deps:
              import datetime
              ts = datetime.datetime.utcfromtimestamp(d.get("createdAt", 0) / 1000).isoformat()
              sha = (d.get("meta") or {}).get("githubCommitSha", "(none)")[:10]
              print(f"  {d.get('uid')} | {d.get('state')} | {ts} | sha {sha} | ready {d.get('readyState')}")
              if failed is None and d.get("state") not in ("READY",):
                  failed = d
          if not failed:
              print("no failed deployment found — nothing to diagnose")
              raise SystemExit(0)
          print(f"--- the failed deployment {failed.get('uid')} ({failed.get('state')}) ---")
          one = vapi(f"https://api.vercel.com/v13/deployments/{failed.get('uid')}")
          be = one.get("blockingError")
          print("blockingError:", json.dumps(be) if be else "(none)")
          print("disabledReason:", one.get("disabledReason"))
          data = vapi(f"https://api.vercel.com/v3/deployments/{failed.get('uid')}/events?limit=100&builds=1")
          events = data.get("events", []) if isinstance(data, dict) else data
          lines = []
          for ev in events:
              if not isinstance(ev, dict):
                  continue
              payload = ev.get("payload", {}) or {}
              txt = payload.get("text") or payload.get("info", {}).get("name", "")
              if txt:
                  lines.append(str(txt))
          for ln in lines[-60:]:
              print(ln[:300])
          PY
