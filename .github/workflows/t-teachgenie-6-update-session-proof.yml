# T-TEACHGENIE-006 — the updateSession LIVE proof runner.
#
# The card of record: the LIVE-pilot blocker (T-TEACHGENIE-003 run-002
# receipt, PR #799) was NOT the grants gap alone — the run-002 hypothesis was
# falsified by T-TEACHGENIE-005's green prod apply (the grants landed,
# has_table_privilege proved all 4 DML verbs × 6 tables to the app role, and
# the write paths STILL 500ed). The true root cause: updateSession handed
# the house sql seam ONE piece carrying the whole hand-numbered statement;
# toQuery (TAGGED-TEMPLATE ONLY: text = s[0] + "$1" + s[1] + "$2" + …)
# appended its own $n trail — "…WHERE id = $2$1$2" proven verbatim — so
# Postgres syntax-errored on EVERY updateSession call (the sub-floor nudge,
# BOTH judged turns post-writes, end-session) while every INSERT/SELECT
# (proper tagged templates) succeeded. Shipped 2026-10-31 (62e786e6,
# T-TEACHME-001 run-002); the FakeStore fixtures cannot see the seam.
#
# This runner executes the FIXED store against the production tables of
# record (SMOKE_DB_URI — the t-teachme-1-vantage-probe smoke secret, the
# same Neon MAIN wire the grants lane used) BEFORE the API redeploy carries
# the fix: flags-only patch, judged-turn counter patch, and the end-session
# STATUS patch fired-and-reverted (net-zero) on the LIVE-pilot session of
# record. Receipt ALWAYS written, host-only scrub.
#
# OPERATOR GATE: workflow_dispatch ONLY — inert until dispatched. This
# run's fire order of record: the operator's "Continue" (zai-web chat
# f8d27d04, trace 1a1ad0a00dc0c991, 2026-11-06) continuing the LIVE-pilot
# order "conduct a live pilot after deployment" (trace 1a1ac4dca771efb5).
# Secret of record: SMOKE_DB_URI (exists). Receipts are scrubbed by
# construction: the driver records the DB host only, never URIs or tokens.

name: t-teachgenie-6-update-session-proof

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "The LIVE-pilot session of record (uuid) — the proof target"
        required: true
      note:
        description: "Operator note for this proof run"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: t-teachgenie-6-update-session-proof
  cancel-in-progress: false

jobs:
  prove-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install workspace deps (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Prove updateSession against the production tables of record
        env:
          SMOKE_DB_URI: ${{ secrets.SMOKE_DB_URI }}
        run: |
          set -euo pipefail
          [ -n "$SMOKE_DB_URI" ] || { echo "SMOKE_DB_URI not staged — abort"; exit 2; }
          [ -n "${{ inputs.session_id }}" ] || { echo "session_id required — abort"; exit 2; }
          bun scripts/t-teachgenie6-prove-update.ts --db "$SMOKE_DB_URI" --session "${{ inputs.session_id }}" --receipt tg6-proof-receipt.json
      - name: Upload the receipt artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tteachgenie6-proof-receipts
          path: tg6-proof-receipt.json
          if-no-files-found: ignore
