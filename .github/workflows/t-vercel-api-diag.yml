# T-VERCEL-API-DIAG run-001 — read-only discovery for the API bake floor.
#
# CONTEXT (T-MG-CH1-MARK-1 follow-up, 2026-11-09): the regions fix is merged
# to main (#864, Nov 8) and the data of record is verified in production
# (workflow run 7 postverify: 9 questions / 95 mark points / 95 rects), but
# api.syllab-ai.com still serves a pre-fix build. The worklog of record
# (.syllabai/worklog.md #658, #857) documents why: the OLD Vercel account is
# usage-blocked (the Nov 5 bake failure -> "why is my account deployment
# blocked"), production of record moved to a SECOND account (the hub's
# manual CLI bakes), and the API project's git integration went silent Nov 4
# (last status 04e3c40a, PR #783) — the API never moved and never baked.
#
# This workflow answers, with ZERO writes, the three facts the bake job
# needs: (1) which team the VERCEL_BAKE_TOKEN sees, (2) whether an API
# project exists there (name / id / rootDirectory), (3) where the
# api.syllab-ai.com domain is assigned. Every request is a GET.
#
# SECRET LAW (t-ops-plane class, unchanged): the token is never printed,
# echoed, or interpolated into log lines; only project/team/domain NAMES and
# ids are printed.

name: t-vercel-api-diag

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Enumerate teams, projects, domains (READ-ONLY GETs)
        env:
          VERCEL_BAKE_TOKEN: ${{ secrets.VERCEL_BAKE_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          def vapi(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + os.environ["VERCEL_BAKE_TOKEN"],
                  "Accept": "application/json", "User-Agent": "t-vercel-api-diag/1"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())

          try:
              teams = vapi("https://api.vercel.com/v2/teams").get("teams", [])
              print("TEAMS visible to the token:", len(teams))
              for t in teams:
                  print("  ", t.get("id"), "| slug", t.get("slug"), "|", (t.get("name") or "")[:48])
          except Exception as e:
              print("teams probe failed (personal-account token?):", type(e).__name__, str(e)[:120])

          projects = vapi("https://api.vercel.com/v9/projects?limit=100").get("projects", [])
          print("PROJECTS on the token's scope:", len(projects))
          for p in projects:
              pid, name = p.get("id"), p.get("name")
              root = p.get("rootDirectory") or "(repo root)"
              latest = "(no production deployments)"
              try:
                  ds = vapi(f"https://api.vercel.com/v6/deployments?projectId={pid}&target=production&limit=1").get("deployments", [])
                  if ds:
                      d = ds[0]
                      latest = f"{d.get('state')} @ {(d.get('meta') or {}).get('githubCommitSha','')[:10]} created {d.get('createdAt')}"
              except Exception as e:
                  latest = f"deployments probe failed: {type(e).__name__}"
              doms = "(none)"
              try:
                  dd = vapi(f"https://api.vercel.com/v9/projects/{pid}/domains").get("domains", [])
                  doms = ",".join(x.get("name", "") for x in dd) or "(none)"
              except Exception as e:
                  doms = f"domains probe failed: {type(e).__name__}"
              print(f"  {name} | id {pid} | rootDirectory {root}")
              print(f"      prod: {latest}")
              print(f"      domains: {doms}")

          # T-HUB-INK-BRK run-003 (2026-11-13): pull the RUNTIME logs of the
          # latest api.syllab-ai.com prod deployment — the pdf-drawings wedge
          # investigation needs the REAL error behind the generic 500s (the
          # ApiError envelope law hides it from the wire). READ-ONLY GETs.
          target = None
          for p in projects:
              dd = vapi(f"https://api.vercel.com/v9/projects/{p['id']}/domains").get("domains", [])
              if any("api.syllab-ai.com" == d.get("name") for d in dd):
                  target = p
                  break
          if not target:
              print("API-LOGS: no project serving api.syllab-ai.com found")
          else:
              pid = target["id"]
              ds = vapi(f"https://api.vercel.com/v6/deployments?projectId={pid}&target=production&limit=1").get("deployments", [])
              if not ds:
                  print("API-LOGS: no prod deployment")
              else:
                  d = ds[0]
                  print(f"API-LOGS deployment {d.get('uid')} state={d.get('state')} aliasAssigned={str(d.get('aliasAssigned'))[:40]}")
                  for ep in ("/v3/deployments/%s/events?limit=300&direction=backward&build=false" % d.get("uid"), "/v2/deployments/%s/events?limit=300&direction=backward&build=0" % d.get("uid")):
                      try:
                          evs = vapi(f"https://api.vercel.com{ep}")
                          if isinstance(evs, dict):
                              evs = evs.get("events", [])
                          print(f"API-LOGS got {len(evs)} runtime events (from {ep.split('/')[1]})")
                          hits = 0
                          for ev in evs:
                              payload = ev.get("payload") or {}
                              text = (payload.get("text") or ev.get("text") or ev.get("payload", {}).get("text") or "")
                              if not isinstance(text, str):
                                  text = json.dumps(text)[:300]
                              t = str(text)
                              if any(k in t.lower() for k in ("error", "500", "pdf-drawings", "drawings", "zod", "parse", "throw", "exception", "fail")):
                                  hits += 1
                                  print("  LOG:", t[:400])
                              if hits >= 25:
                                  break
                          if hits == 0:
                              print("API-LOGS: no error-shaped lines in the first event page (event sample below)")
                              for ev in evs[:8]:
                                  payload = ev.get("payload") or {}
                                  text = (payload.get("text") or ev.get("text") or "")
                                  print("  sample:", str(text)[:200])
                      except Exception as e:
                          print(f"API-LOGS events probe failed ({ep.split('/')[1]}):", type(e).__name__, str(e)[:160])
          PY

      # T-OPS-PLANE run-001 (2026-11-13): the ACCOUNT-MIGRATION probe — the
      # production of record moved to a SECOND Vercel account after the old
      # one went usage-blocked (Nov 5); this step verifies what the
      # migration actually covers today: the team of record, each project's
      # git link, every domain's VERIFIED flag (verified=true ⇒ DNS points
      # at THIS account — the authoritative ownership signal), the last 8
      # prod deployments (what this account actually built), and the env
      # NAME inventory (names only — the SECRET law). Read-only GETs.
      - name: Account-migration probe (git links, domain verified flags, deployment history, env names)
        if: always()
        env:
          VERCEL_BAKE_TOKEN: ${{ secrets.VERCEL_BAKE_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          def vapi(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + os.environ["VERCEL_BAKE_TOKEN"],
                  "Accept": "application/json", "User-Agent": "t-vercel-account-diag/1"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())

          teams = vapi("https://api.vercel.com/v2/teams").get("teams", [])
          print(f"MIGRATION TEAMS visible to the token: {len(teams)}")
          for t in teams:
              print(f"  TEAM {t.get('id')} slug={t.get('slug')} name={(t.get('name') or '')[:48]}")
              for k in ("plan", "createdAt", "ssoConnected"):
                  if t.get(k) not in (None, ""):
                      print(f"    team.{k} = {t[k]}")

          projects = vapi("https://api.vercel.com/v9/projects?limit=100").get("projects", [])
          print(f"MIGRATION PROJECTS: {len(projects)}")
          for p in projects:
              pid, name = p.get("id"), p.get("name")
              link = p.get("link") or {}
              print(f"\n  PROJECT {name} | rootDirectory {p.get('rootDirectory') or '(repo root)'} | createdAt {p.get('createdAt')}")
              print(f"    git link: type={link.get('type')} repo={link.get('repo') or '(none)'} prodBranch={link.get('productionBranch') or '(default)'}")
              try:
                  dd = vapi(f"https://api.vercel.com/v9/projects/{pid}/domains").get("domains", [])
                  for d in dd:
                      print(f"    DOMAIN {d.get('name')} verified={d.get('verified')} redirect={(d.get('redirect') or '')[:40]} createdAt={d.get('createdAt')}")
              except Exception as e:
                  print(f"    domains probe failed: {type(e).__name__} {str(e)[:120]}")
              try:
                  ds = vapi(f"https://api.vercel.com/v6/deployments?projectId={pid}&target=production&limit=8").get("deployments", [])
                  print(f"    last {len(ds)} prod deployments:")
                  for d in ds:
                      meta = d.get("meta") or {}
                      extra = {k: str(d[k])[:60] for k in ("canceledAt", "errorMessage", "forbidden") if d.get(k)}
                      print(f"      {d.get('uid')} {d.get('state')} sha={(meta.get('githubCommitSha') or '(manual)')[:10]} created={d.get('createdAt')} aliasAssigned={str(d.get('aliasAssigned'))[:24]}" + (f" extra={extra}" if extra else ""))
              except Exception as e:
                  print(f"    deployments probe failed: {type(e).__name__} {str(e)[:120]}")
              try:
                  envs = vapi(f"https://api.vercel.com/v9/projects/{pid}/env?limit=100").get("envs", [])
                  keys = sorted({e.get("key", "") for e in envs})
                  print(f"    ENV names ({len(envs)}): {', '.join(keys) if keys else '(none)'}")
              except Exception as e:
                  print(f"    env probe failed: {type(e).__name__} {str(e)[:120]}")
          PY
