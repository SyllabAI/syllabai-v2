# T-VERCEL-API-BAKE run-001 — the production bake floor for the API project.
#
# Mirrors the proven t-vercel-usage-bake law (run-001..005 receipts) for the
# OTHER project of record: the API (syllabai-v2, prj_vf1MQaCuuGHd83HaTA3uqDx
# ETpb5, domains api.syllab-ai.com + syllabai-v2-six.vercel.app — discovered
# first-hand by t-vercel-api-diag run-001, 2026-11-09 06:07Z).
#
# THE RECIPE OF RECORD (T-VERCEL-API-STAGE run-001, 2026-11-11): the project's
# Vercel build settings are ALL unset (framework/buildCommand/outputDirectory/
# rootDirectory — null on the old account AND the new one; the migration never
# carried them). Serving works because the deployable is a PREBUILT STAGE:
#   vercel.json        (rewrites /api/v1/(.*) and /actuator/health -> /api/index)
#   api/index.js       (ONE esbuild-bundled Node lambda, default-exported handler)
#   api/concept-graph/ (SHA-256-pinned snapshot yamls read from __dirname)
# produced by scripts/api-stage/build.sh and gated by
# scripts/api-stage/localgate-server.cjs BEFORE any deploy. The recipe was
# recovered by deployment archaeology on the old account's serving lane
# (dpl_7Q3CRpcTWavgD6VMbXvSrpshCVKV) and validated locally to byte-shape
# parity with the live surface (docs/T-VERCEL-API-SERVING-RECOVERY.md).
#
# THE 2026-11-10 INCIDENT (never again): run-2 (schedule) deployed the
# MONOREPO ROOT — no vercel.json, no api/ — producing an EMPTY deployment;
# api.syllab-ai.com 404'd on every path for ~19h (first live probe 2026-11-11
# ~03:38Z; restored 2026-11-11 ~06:0xZ by the ops lane). Doctrine note
# closed: this floor now boots the bundle and probes the LIVE surface after
# the deploy — a bake without a serving proof is not a bake.
#
# STRICT DISPOSITIONS (t-ops-plane doctrine class, unchanged):
#   - VERCEL_BAKE_TOKEN is a repository secret: never printed, never
#     echoed, never interpolated into log lines.
#   - prod writes: at most ONE deployment per run, and ONLY when the
#     newest LIVE (READY/BUILDING/QUEUED/INITIATING) production
#     deployment's meta.githubCommitSha differs from main HEAD.
#   - the stage is GATED (boot + health parity) before the deploy, and the
#     LIVE surface is probed after it; either check red = job red.
#   - the gate env values are STAGE-ONLY dummies (boot law demands >=32 bytes;
#     the gate probes never touch the database) — they are not secrets and
#     are deliberately non-production strings.
#   - no other environment touched.
#
# SCHEDULE: re-armed 2026-11-11 (operator order "re-arm the bake schedule",
# trace 1a1cad986dc88415) at the original 03:30 UTC cadence — one hour behind
# the hub floor's 02:30 UTC, as staggered from day one. The 2026-11-10
# incident class is closed by construction: the stage carries its own
# vercel.json (an empty deployment is structurally impossible from this
# recipe), the boot gate blocks a bad build BEFORE the deploy, and the
# post-deploy LIVE serving proof turns any silent regression into a red job.
# A scheduled run at an already-current HEAD is a no-op read (the
# state-aware skip).

name: t-vercel-api-bake

on:
  schedule:
    - cron: "30 3 * * *" # 03:30 UTC — staggered one hour after the hub floor
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bake-api-prod
  cancel-in-progress: false

env:
  API_PROJECT_ID: prj_vf1MQaCuuGHd83HaTA3uqDxETpb5
  API_PROJECT_NAME: syllabai-v2
  STAGE_DIR: /tmp/api-stage

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve main HEAD
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read current production state (Vercel API, read-only)
        id: prod
        env:
          VERCEL_BAKE_TOKEN: ${{ secrets.VERCEL_BAKE_TOKEN }}
          PROJECT_ID: ${{ env.API_PROJECT_ID }}
        run: |
          curl -sSf -H "Authorization: Bearer $VERCEL_BAKE_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$PROJECT_ID&target=production&limit=5" \
            | python3 -c "
          import json, os, sys
          live = {'READY', 'BUILDING', 'QUEUED', 'INITIATING'}
          pick = next((d for d in json.load(sys.stdin).get('deployments', []) if d.get('state') in live), None)
          sha = (pick.get('meta') or {}).get('githubCommitSha', '') if pick else ''
          state = pick.get('state', 'none') if pick else 'none'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('sha=' + sha + chr(10) + 'state=' + state + chr(10))
          print('newest live API deployment: ' + state + ' @ ' + (sha[:10] if sha else '(no commit sha — pre-meta deployment)'))
          "

      - name: Preflight — print the API project's build settings (read-only)
        if: steps.prod.outputs.sha != steps.head.outputs.sha
        env:
          VERCEL_BAKE_TOKEN: ${{ secrets.VERCEL_BAKE_TOKEN }}
          PROJECT_ID: ${{ env.API_PROJECT_ID }}
        run: |
          curl -sSf -H "Authorization: Bearer $VERCEL_BAKE_TOKEN" \
            "https://api.vercel.com/v9/projects/$PROJECT_ID" \
            | python3 -c "
          import json, sys
          p = json.load(sys.stdin)
          for k in ('name', 'framework', 'nodeVersion', 'buildCommand', 'devCommand', 'installCommand', 'outputDirectory', 'rootDirectory'):
              print(k + ': ' + str(p.get(k)))
          "

      - name: Skip when production is already current
        if: steps.prod.outputs.sha == steps.head.outputs.sha
        run: echo "API production already at main HEAD — nothing to bake"

      - name: Build the prebuilt stage (scripts/api-stage/build.sh)
        if: steps.prod.outputs.sha != steps.head.outputs.sha
        run: bash scripts/api-stage/build.sh "$STAGE_DIR"

      - name: Gate the stage (boot + health parity, stage-only dummy envs)
        if: steps.prod.outputs.sha != steps.head.outputs.sha
        env:
          # stage-only dummy, >=32 bytes per the bundle boot law
          # (syllabai.security.jwt-secret); never a production value
          SYLLABAI_JWT_SECRET: stage-gate-not-a-secret-0123456789abcdef
          DATABASE_URL: postgres://stage-gate:stage-gate@127.0.0.1:5432/stage-gate
        run: node scripts/api-stage/localgate-server.cjs "$STAGE_DIR" 8971

      - name: Install Vercel CLI
        if: steps.prod.outputs.sha != steps.head.outputs.sha
        run: npm install -g vercel@latest

      - name: Link project (INSIDE the stage dir — the deploy cwd)
        if: steps.prod.outputs.sha != steps.head.outputs.sha
        env:
          VERCEL_BAKE_TOKEN: ${{ secrets.VERCEL_BAKE_TOKEN }}
        run: |
          # run-001 receipt (2026-11-12 06:21Z): linking in the repo root while
          # deploying from "$STAGE_DIR" left the stage dir UNLINKED — the CLI
          # auto-linked a project named after the directory, the bake landed in
          # api-stage (no production env → FUNCTION_INVOCATION_FAILED) and
          # syllabai-v2 production stayed on the old build while the
          # version-agnostic serving proof still passed. The link must happen
          # in the same directory the deploy runs from.
          cd "$STAGE_DIR"
          vercel link --yes --project "$API_PROJECT_NAME" --token="$VERCEL_BAKE_TOKEN"

      - name: Bake production (CLI deploy FROM THE GATED STAGE; source-tagged with main HEAD)
        if: steps.prod.outputs.sha != steps.head.outputs.sha
        env:
          VERCEL_BAKE_TOKEN: ${{ secrets.VERCEL_BAKE_TOKEN }}
        run: |
          SHA="$(git rev-parse HEAD)"
          cd "$STAGE_DIR"
          vercel deploy --prod --yes \
            --meta "githubCommitSha=$SHA" \
            --meta "githubCommitRef=main" \
            --token="$VERCEL_BAKE_TOKEN"

      - name: Post-deploy serving proof (promotion sha + read-only live probe)
        if: steps.prod.outputs.sha != steps.head.outputs.sha
        env:
          VERCEL_BAKE_TOKEN: ${{ secrets.VERCEL_BAKE_TOKEN }}
          BAKE_SHA: ${{ steps.head.outputs.sha }}
        run: |
          sleep 15
          # Promotion proof first: the run-001 receipt — the health/login
          # probes are version-agnostic (the OLD build answers them green
          # too), so the proof must assert production actually TOOK the
          # merge commit before anything else.
          curl -sSf -H "Authorization: Bearer $VERCEL_BAKE_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$API_PROJECT_ID&target=production&limit=5" \
            | BAKE_SHA="$BAKE_SHA" python3 -c "
          import json, os, sys
          live = {'READY', 'BUILDING', 'QUEUED', 'INITIATING'}
          deploys = [d for d in json.load(sys.stdin).get('deployments', []) if d.get('state') in live]
          pick = deploys[0] if deploys else None
          sha = (pick.get('meta') or {}).get('githubCommitSha', '') if pick else ''
          state = pick.get('state', 'none') if pick else 'none'
          head = os.environ['BAKE_SHA']
          print('newest live API deployment after bake: ' + state + ' @ ' + (sha[:10] if sha else '(none)'))
          print('main HEAD of record:                    READY @ ' + head[:10])
          if sha != head:
              print('PROMOTION PROOF RED: production did not take the merge commit')
              sys.exit(1)
          if state != 'READY':
              print('PROMOTION PROOF RED: the promoted deployment is not READY')
              sys.exit(1)
          "
          echo "PROMOTION PROOF GREEN — production is at main HEAD"
          echo "--- /actuator/health (expect 200 UP, never the NOT_FOUND page) ---"
          H=$(curl -s -w "\n%{http_code}" https://api.syllab-ai.com/actuator/health)
          echo "$H"
          echo "$H" | tail -1 | grep -q 200 || { echo "SERVING PROOF RED: health not 200"; exit 1; }
          echo "$H" | grep -q '"status":"UP"' || { echo "SERVING PROOF RED: not the UP shape"; exit 1; }
          echo "--- POST /api/v1/auth/login {} (expect JSON 400 validation_failed) ---"
          L=$(curl -s -w "\n%{http_code}" -X POST -H "Content-Type: application/json" -d '{}' https://api.syllab-ai.com/api/v1/auth/login)
          echo "$L"
          echo "$L" | tail -1 | grep -q 400 || { echo "SERVING PROOF RED: login-garbage not 400"; exit 1; }
          echo "$L" | grep -q "validation_failed" || { echo "SERVING PROOF RED: not the API error shape"; exit 1; }
          echo "$L" | grep -q "NOT_FOUND" && { echo "SERVING PROOF RED: the empty-deployment 404 shape"; exit 1; }
          echo "SERVING PROOF GREEN — the deployment serves the API, not the empty shell"
