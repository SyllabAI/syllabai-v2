# T-MIG-000: use the classic hoisted (flat) linker for the unified workspace.
# bun >=1.3 defaults to the isolated (pnpm-style) linker in workspaces; the
# imported hub's Next.js/Turbopack build fails to resolve peer/nested deps
# through the symlink layout (@tiptap/core, unist-util-visit-parents).
# The hoisted layout matches the hub's legacy standalone install layout —
# dependency VERSIONS are unchanged, only placement.
[install]
linker = "hoisted"
