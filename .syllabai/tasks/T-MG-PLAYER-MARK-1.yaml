  ground_truth: >
    Commissioning found the draft plan's "delete or repoint the 501 stub" premise
    WRONG in one half: the stub (apps/hub/src/app/api/ai/mark/route.ts, ADR-029)
    is the honest LEGACY-lane floor (SME corpus IDs do not map to core parts) and
    stays byte-identical. The REAL gap sits on the CORE-live lane (CoreMarkingFlow):
    it owns core question_parts UUIDs (join.structured parts) but the learner gets
    no AI mark until real attempts are submitted. MG's live capture (2026-11-04,
    docs/MG-MARK-ROLLOUT-PLAN.md §2) shows the value moment: type -> mark -> read,
    nothing written to the account. The typed regrade channel was built for exactly
    this and has no caller.
  acceptance_pins:
    - "(wire pin) apps/hub/src/lib/paper-marks.ts gains requestPartRegrade(partId, answerHtml, token, fetchImpl) — the mirror-law client of POST /api/v1/paper-marks/parts/:partId/regrade: 202 -> accepted {markId}; 400/404/422 envelopes -> rejected {message}; no token -> no_token; missing origin -> unconfigured; everything undefined -> failed. Polling reuses pollUntilTerminal verbatim (retry: 0 — a re-mark is a NEW job)."
    - "(lane pin) the affordance lives ONLY on the core-live lane's draft phase (CoreMarkingFlow): per structured part (join.structured parts mapping hubPartId->corePartId, the SAME ids submitStructuredAttempt consumes) with a non-empty draft, one advisory run marks every part; the verdict renders through feedbackCopyModel (the five-field copy law + the failure-only strategies law — single-sourced from region-mark/paper-feedback). The authoritative Smart Mark flow, the attempt plane, and the legacy lane are byte-identical in behaviour."
    - "(honesty pin) the affordance is labeled advisory — writes no attempt; parts whose plan() resolves no mark_points render the honest 422 no_mark_points class ('no mark scheme definitions for this part yet'); failed/timeout/lost poll outcomes render their honest classes (the poll loop's semantics, never a fabricated mark)."
    - "(gate-1 pin) zero diffs on apps/api/src/services/paper-marking/prompt.ts, PROMPT_VERSION, packages/contracts/**, packages/db/** — the run is hub-only: lib/paper-marks.ts, question-player.tsx, one bun test beside the lib."
  non_goals:
