    - ROW CONTRACT: payload.decayedPrior (double, C1 scored forecast — the
      computed never-persisted pre-attempt estimate, NOT the stored anchor);
      payload.correctness (boolean) — missing/unparseable EITHER, or latent
      outside [0,1] → skippedRows++ (counted globally, never attributed);
      nodeId filter compares payload.nodeId string-equal to the filter —
      filtered rows land in NEITHER bucket ("filtered, not malformed").
    - EMISSION MAPPING (C2): predicted = latent*(1-slip) +
      (1-latent)*guess_resolved — slip GLOBAL 0.1 (ADR-033 declined
      format-aware slip); guess per format through the SAME resolver the
      update path uses: LearnerProperties.Bkt.toParams(type, optionCount) —
      MCQ_SINGLE && optionCount>=2 → 1.0/optionCount; MCQ_SINGLE else →
      guess 0.25; SHORT_ANSWER → shortAnswerGuess 0.05; STRUCTURED →
      structuredGuess 0.01; null/blank/unknown → 0.25; then
      min(resolved, 1-slip-1e-9) clamp ("degrade, never invert").
      Bkt compact-ctor normalization: any param <=0 falls back to paper
      (0.1/0.1/0.25/0.1 + 0.05 + 0.01).
    - BINS: ten equal-width over [0,1]: bin = min(9, max(0, floor(latent*10)));
      lowerBound i/10.0, upperBound (i+1)/10.0. Three states: EMPTY (count 0
      → all means 0.0 honest zeros, suppressed=false), SUPPRESSED (count>0,
      distinct binLearners < k → all means null, traffic visible), REPORTABLE.
    - K-ANONYMITY (C7 resolution, ADR-036 BINDS THE PORT): k=5
      MIN_REPORTABLE_LEARNERS as a CODE CONSTANT (deliberately not
      configuration); unit = DISTINCT learnerId per cell (pooled headline,
      pooled bins, each segment, each bin-within-segment — one learner can
      stack rows in one bin, so row floors would lie); suppressed cells
      render statistics null with counts visible everywhere (sampleCount,
      learnerCount, bin counts, skippedRows); segment aggregate Brier/ECE
      still INCLUDE suppressed bins' contributions (no selection bias);
      empty cells are distinct from suppressed (honest zeros vs nulls).
    - FORMAT SEGMENTS (C4 §2, fixed render order): MCQ_SINGLE(2-3),
      MCQ_SINGLE(4), MCQ_SINGLE(5+), MCQ_SINGLE(malformed) [optionCount<2],
      SHORT_ANSWER, STRUCTURED, UNTYPED (null/blank/unrecognized — priced
      identically to the paper constant, so the fold never mixes pricing);
      segments partition the contract rows; pooled sampleCount = Σ segment
      counts; empty segments render with honest zeros.
    - GAP SEGMENTS (C4 §6 item 4, fixed render order): "0" / "1-30" /
      "31-90" / "91-365" / "366+" / UNKNOWN (missing/unparseable/negative —
      defensive tail: the publisher always writes gapDays, so a populated
      UNKNOWN is a payload-contract finding); gapDays parses Number OR
      numeric-string (longValue posture); zero-gap = the bit-identity leg
      between decayed and raw priors; each gap segment carries meanAnchor
      (mean raw priorMastery over rows carrying one; 0.0 when none).
    - STATISTICS: Brier = mean (predicted-outcome)^2 on the EMISSION-MAPPED
      prediction; ECE = Σ (binCount/n)·|meanPredicted - observed| over
      non-empty bins (same accumulation reused per segment); bin
      calibrationError SIGNED meanPredicted - observedAccuracy; meanAnchor
      excludes rows without an anchor (anchorN); malformed-row skip precedes
      the nodeId filter in the row walk.
    - WIRE: CalibrationReport {sampleCount, skippedRows, brier, ece, bins[10],
      segments[7], gapSegments[6], learnerCount, suppressed} — Jackson
      records; Doubles null when suppressed; learnerCount is the honest
      quantifier of the node-outcomes-not-iid-learners caveat (descriptive
      instrument, no confidence intervals — stated in the frozen javadoc).
    - DEFENSIVE PARSERS: doubleValue/longValue accept Number or
      non-blank-numeric-String, else null (Jackson jsonb payloads may carry
      either) — ported verbatim.
