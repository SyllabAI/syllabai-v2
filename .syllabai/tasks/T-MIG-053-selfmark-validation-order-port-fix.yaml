  execution_record: >
    FROZEN DERIVATION (read at syllabai-core @ 6cad6ef, 2026-10-06): the
    golden case w3-selfmark-unknown-attempt-500 POSTs body {} — Jackson
    binds SelfMarkRequest(parts=null, comment=null); SelfMarkRequest
    declares NO constraint on the parts list itself, so @Valid passes (the
    @NotNull/@Min/@Max constraints live on the PartSelfMark ELEMENTS, of
    which there are none); the controller's dedup loop
    (LearnerSelfMarkController.java:42-43, "for (PartSelfMark p :
    request.parts())") then NPEs on the null list; the NPE is unmapped and
    falls to the GlobalExceptionHandler catch-all (:224-230) which serves
    the opaque 500 internal_error "an internal error occurred". The
    service is NEVER reached — LearnerSelfMarkService.java:74-76 (the
    empty-marks BadRequestException gate) only fires for an empty LIST
    (parts: []), which the TS port already reproduces exactly. The
    unknown-attempt attribution in the golden case description (finding
    F-a: "core returns 500 (not 404) on unknown attempt self-mark") is
    mechanistically imprecise: with VALID parts the frozen service maps
    the unknown attempt to NotFoundException → 404 (:79-80) — which the
    port already pins (routes.test.ts "unknown attempt → 404"). The
    captured 500 is purely the null-parts NPE. DIVERGENCE (live replay
    census, run 37398183529 verdict 108/170): [seed]
    w3-selfmark-unknown-attempt-500 — TS 400 bad_request "self-mark
    carries no part marks" vs frozen 500 internal_error; the port routes
    {} through selfMarkRequestSchema (nullish-accepting by design) into
    the service gate. FIX (R-053-A, routes/selfmark/index.ts only): after
    the schema parse succeeds (binding + element validation, the frozen
    Jackson→@Valid order) and BEFORE the dedup loop, a nullish parsed
    parts (absent or JSON-null) throws a plain Error that escapes the
    handler to the app error boundary — index.ts onError (:314-322)
    serves apiError(500, "internal_error", "an internal error occurred"),
    the byte-equivalent of the frozen catch-all envelope
    ({status,error,message,timestamp}; timestamp tolerated by the golden
    comparator). Mechanism parity: frozen = uncaught NPE → advice; port =
    uncaught Error → onError. The service, the contracts schema
    (nullish-accepting IS the Jackson-parity binding law, pinned by
    contracts tests :204-205), and every other route are untouched. The
    route's now-dead "parts: null → must not be null" classifier branch
    and the CAPTURED QUIRK header are updated to record the resolved R0
    call (comment-only, disclosure hygiene). Contracts comment updated
    comment-only ("divergence call = R0" → resolved frozen-faithful as
    500, T-MIG-053). Test pins added (routes.test.ts, the file that
    already hosts the self-mark router tests): {} → 500 internal_error
    exact envelope (the captured golden shape), parts:null → 500 (same
    NPE), parts:[] → 400 "self-mark carries no part marks" (service gate,
    previously unpinned at the HTTP surface); the stale "captured 500
    stays disclosed for R0" title on the 404 test is updated (the
    posture itself — 404 with valid parts — is unchanged and confirmed
    frozen-faithful). No fake-SQL fixture regex changes: the NPE-parity
    throw precedes any SQL, so no route regex text moves.
  cross_slice_contract: >
