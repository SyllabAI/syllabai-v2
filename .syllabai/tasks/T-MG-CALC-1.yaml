  acceptance_pins:
  - '(fix pin — FIX-vs-exact) FIX N must override the display of exact rationals the way the device does:
    with Fix 2 set, 5÷3 renders 1.67 (today formatNatural''s fraction branch returns n/d for every exact
    value and ignores fix — a real fidelity deviation, verified on prod); S⇔D under FIX stays device-honest
    (the device hides S⇔D under FIX — check the device law before wiring) and Fix off restores the exact
    law'
  - '(fix pin — structural SHIFT remaps) SHIFT must remap the structural keys whose shifted function exists
    as a standalone key today: SHIFT+Square → Cube insert, SHIFT+Square root → Cube root insert, SHIFT+Logarithm
    → Ten-to-the-power insert (the device law: the shift legend is the key''s primary shifted function
    — today only the trig family remaps, to Arcsin/Arccos/Arctan, which is correct); the shift relabel
    must swap the legends the way the trig row already does, and the one-shot consume law is preserved'
  - (open-question pin — physical keyboard) the overlay accepts NO physical-keyboard input today (no keydown
