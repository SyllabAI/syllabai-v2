  notes: 'DESIGN of record: the unit of selection moves from "≤3 hand-picked spec points" (MG ≤3
    topics parity) to "ONE revision note" (one note ≈ one MG topic). The grouping is the SAME
    canonical spec tree every notes surface uses (never a second taxonomy): unit = TOPIC dropdown,
    topic = SUBTOPIC dropdown, notes anchored via subtopicOfNote (the notes-index law). The picked
    note''s specPointCodes are sent VERBATIM as the create request''s specPointIds — so the G1 canon
    gate, the G2 note-corpus gate (the overlap detector already joins revision_note on these codes),
    the objectives shape law, quota, ceilings and D2/D4 all hold unchanged. Contract ceiling 3→8:
    the committed 4CH1 corpus carries 1–4 codes per note (72×1, 27×2, 12×3, 1×4 — all 112 notes
    place, zero loose, zero zero-code); 8 = headroom, aligned with the objective ordinal ceiling
    (migration 0025). No hub-side eligibility is fabricated — create() still refuses honestly
    (COURSE_NOT_ELIGIBLE) when the serving corpus cannot ground the note.'
