  title: "Grade Boundaries wave 5 — MathsGenie style parity: the operator put MG's live predicted-grade-calculator next to ours and the calculator speaks MG's language again (pills, graded meter, mean-row Average, fitted table, hue-ramped graph)"
  owner: "main agent (Z.ai, zai-web session web-19f335c2-abed-4ade-968a-305029b290e3)"
  status: IN_REVIEW
  priority: P1
  band: T-GRADE (grade boundaries)
