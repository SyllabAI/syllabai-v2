execution_record: >
    Defects 1-6 were recorded 2026-11-20 in
    docs/PENDING-selector-content-gaps-2026-11-20.md ("related open QA defects,
    separate lanes") from the QA session's live repro. UPDATE 2026-11-20
    (run-001, operator directive "Proceed"): swept all six from code.
    DISPOSITIONS —
    (4) /sitemap.xml 404 + no Sitemap: in robots.txt → FIXED (commit on
    t-qa-def-001/fix): src/app/sitemap.ts metadata route (10 static public
    pages + all 106 course pages from the registry of record
    content/courses.json; the grade-boundaries/seneca/video-map content dirs
    are non-course assets), origin = layout.tsx's metadataBase
    (https://www.syllab-ai.com), robots.txt gains the matching Sitemap: line;
    pure buildSitemapEntries + 3 law tests, tsc + eslint clean.
    (5) Stale login count → FIXED same commit: "94 courses" → "103" (the
    census of record counts 103 notes-bearing courses).
    (6) editor/me 403 auto-probe → WON'T-FIX BY DESIGN: identity.ts's
    probeEditorCapability is the ADR-044 Phase-1 capability bootstrap — one
    GET per signed-in session, fail-closed (401/403 → null, no retry storm),
    already identity-gated (signed-out sessions never fire it). Editor-ness
    is a grant row, not a session claim, so the client cannot know without
    asking; the 403 is the designed answer for non-editors, not a bug. The
    console-noise complaint could only be removed by moving editor-ness into
    the session payload — an API/ADR-044 change, not a client gate.
    (1) GET /api/v1/learners/me/progress 401 → INVESTIGATED, NO STATIC ROOT
    CAUSE: the route mounts alongside the working siblings
    (index.ts:346, after the global identity.authMiddleware at :205), uses
    the SAME requireAuth/getAuth posture as routes/learner/index.ts (agenda/
    courses 200). Statically symmetric. Needs a LIVE repro with the demo
    token (sandbox has no auth) before any auth-semantics change — do NOT
    blind-fix.
    (2) React #418 on /dashboard → INVESTIGATED, NO STATIC CULPRIT: no
    time-based text, no random/locale formatting in server-rendered paths;
    the localStorage reads in dashboard-shell.tsx are effect-guarded. Needs
    the live 1-per-load repro (console component stack) to pin the divergent
    subtree — do NOT guess-fix.
    (3) syllabai.com parked for sale → EXTERNAL/OPS: DNS registrar property,
    not fixable in-repo. NOTE: the codebase's origin of record is
    www.syllab-ai.com (layout.tsx metadataBase) — the sitemap now uses it.
    LANDED 2026-11-20: defects 4+5 merged to main via PR #1162 (c7cd95b9).
    The card stays OPEN only for the live-repro items: (1) /progress 401
    and (2) dashboard #418 need browser-verified repros; (3) is external;
    (6) is by-design. No sandbox push blocker remains.
