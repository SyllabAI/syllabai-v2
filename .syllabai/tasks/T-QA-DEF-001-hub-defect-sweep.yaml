execution_record: >
    Defects 1-6 were recorded 2026-11-20 in
    docs/PENDING-selector-content-gaps-2026-11-20.md ("related open QA defects,
    separate lanes") from the QA session's live repro. UPDATE 2026-11-20
    (run-001, operator directive "Proceed"): swept all six from code.
    DISPOSITIONS —
    (4) /sitemap.xml 404 + no Sitemap: in robots.txt → FIXED (commit on
    t-qa-def-001/fix): src/app/sitemap.ts metadata route (10 static public
    pages + all 106 course pages from the registry of record
    content/courses.json; the grade-boundaries/seneca/video-map content dirs
    are non-course assets), origin = layout.tsx's metadataBase
    (https://www.syllab-ai.com), robots.txt gains the matching Sitemap: line;
    pure buildSitemapEntries + 3 law tests, tsc + eslint clean.
    (5) Stale login count → FIXED same commit: "94 courses" → "103" (the
    census of record counts 103 notes-bearing courses).
    (6) editor/me 403 auto-probe → WON'T-FIX BY DESIGN: identity.ts's
    probeEditorCapability is the ADR-044 Phase-1 capability bootstrap — one
    GET per signed-in session, fail-closed (401/403 → null, no retry storm),
    already identity-gated (signed-out sessions never fire it). Editor-ness
    is a grant row, not a session claim, so the client cannot know without
    asking; the 403 is the designed answer for non-editors, not a bug. The
    console-noise complaint could only be removed by moving editor-ness into
    the session payload — an API/ADR-044 change, not a client gate.
    (1) GET /api/v1/learners/me/progress 401 → INVESTIGATED, NO STATIC ROOT
    CAUSE: the route mounts alongside the working siblings
    (index.ts:346, after the global identity.authMiddleware at :205), uses
    the SAME requireAuth/getAuth posture as routes/learner/index.ts (agenda/
    courses 200). Statically symmetric. Needs a LIVE repro with the demo
    token (sandbox has no auth) before any auth-semantics change — do NOT
    blind-fix.
    (2) React #418 on /dashboard → INVESTIGATED, NO STATIC CULPRIT: no
    time-based text, no random/locale formatting in server-rendered paths;
    the localStorage reads in dashboard-shell.tsx are effect-guarded. Needs
    the live 1-per-load repro (console component stack) to pin the divergent
    subtree — do NOT guess-fix.
    (3) syllabai.com parked for sale → EXTERNAL/OPS: DNS registrar property,
    not fixable in-repo. NOTE: the codebase's origin of record is
    www.syllab-ai.com (layout.tsx metadataBase) — the sitemap now uses it.
    LANDED 2026-11-20: defects 4+5 merged to main via PR #1162 (c7cd95b9).
    The card stays OPEN only for the live-repro items: (1) /progress 401
    and (2) dashboard #418 need browser-verified repros; (3) is external;
    (6) is by-design. No sandbox push blocker remains.
    ITEM (1) CLOSED 2026-11-20 (run-002, impl 852e2154, branch
    t-qa-def-001/run-001 off dfa5a93f): ROOT CAUSE FOUND — the of-record
    "statically symmetric, no root cause" conclusion was correct about the
    api and aimed at the wrong side of the wire: the hub's projection fetch
    (progress-server.ts) was BARE — no Authorization header; browsers never
    auto-attach Bearer tokens, so the request reached the api anonymous and
    the authz shell (routes/learner/progress.ts:36) answered 401
    fail-closed, while agenda/courses rode the authed api.ts helpers
    (:1129/:1204/:1231) and 200'd. The client getToken() gate decided
    WHETHER to fetch, never HOW. The run-001 directive ("needs a live repro
    before any auth-semantics change; do NOT blind-fix") is honored: this
    changes NO auth semantics — the api is untouched (one global middleware,
    one authenticator instance feeding every /learners/me router per
    index.ts:179/:284/:307/:320 on the current tree; the fail-closed shell
    is the designed posture), and the fix makes the hub fetch carry the
    same header its siblings (drill/study-plan/battle) already carry. The
    mechanism is deterministic — a valid token plus the missing header fully
    explains 200-vs-401, and the 200ing siblings prove the token itself was
    valid; a full-stack browser repro stays available for belt-and-braces
    verification. FIX: projectionFetchInit(token) — the wire contract of
    record (Bearer when signed-in, honest absence when not) — wired into the
    fetch and pinned by 2 law tests. Gates: 34/34 across progress-server +
    progress-notes-ring + progress-select-rings + note-scroll; tsc error set
    identical to the main baseline (4 pre-existing env-dependent failures in
    untouched files — CI hub lane is the build of record); eslint 0. The
    card stays OPEN only for item (2) (#418 live repro).
    ITEM (2) PROGRESS 2026-11-20 (run-003, records only — no fix, the
    do-not-guess-fix directive stands): a reusable LOCAL DEV REPRO RIG now
    exists — hub dev + .env.local SESSION_SECRET + a forged sai_session
    routing cookie (session.ts HS256 shape) + agent-browser + seeded
    returning-user localStorage — and it hydrates /dashboard CLEANLY (no
    #418, deterministic across loads). The static sweep was RE-RUN on the
    current tip (the run-001 sweep predated the rings/sidebar landings):
    every store hook follows the useSyncExternalStore server-snapshot law,
    the five dashboard cards have no render-path time/locale/random/storage
    reads, the identity branch is hydration-safe — run-001's "no static
    culprit" verdict HOLDS on fresh code. The divergent subtree therefore
    needs the live component stack from the deployed signed-in session (or
    api branch DB credentials to serve the local rig real data — a
    five-minute turnaround with the rig). The rig recipe is in
    receipts/T-QA-DEF-001/run-003.json; the card stays OPEN for item (2).
