      false, engineerSymbol false}}; 'fx-85gt-cw' (same, solar TRUE);
      'fx-991cw' {label 'fx-991CW', skin {shiftColor gold, solar true},
      shiftOverrides {sq → {label log, aria 'Logarithm base 10'},
      lparen → {label =, aria Equals}, d9 → {label i, aria
      'Imaginary unit'}}, features {recurringDecimal false, complex
      true, engineerSymbol true}}; level→model map n {gcse, ks2 →
      fx-83gt-cw; a-level, as-level, igcse, international-* → fx-991cw};
      app registry 12 registrations (t(name,label,enabled)):
      calculate ✓ statistics ✓ table ✓ ratio ✗ mathBox ✗
      distribution ✗ spreadsheet ✗ equation ✗ inequality ✗
      complex ✗ baseN ✗ matrix ✗ vector ✗ (per-model lists l = 5 apps
      for 83/85GT, a = 12 for 991CW); CATALOG categories
      catalog/{trig, angle, function-analysis, numeric, probability,
      statistics, other}; key aria map includes the full CW shell
      (Home/Settings/Tools/Catalog/Shift/Variable/OK/On/Off, A–F
      'variable a'…'variable f', Mixed fraction, 'Logarithm with base',
      'Times ten to the power', 'QR code'); error strings Math/Syntax/
      Stack/Argument/Range ERROR; CSS component inventory cw-lcd/
      cw-entry-line/cw-result-line/cw-frac/cw-mixed/cw-sqrt/cw-radical/
      cw-root-index/cw-recur-digit/cw-abs/cw-keypad/cw-key/cw-home-grid/
      cw-nav-grid/cw-menu-row/cw-list-row/cw-form-row/cw-error-title/
      cw-error-hint/cw-solar/cw-indicators — a DOM-native natural-
      display renderer, not canvas.
    live_probes_20261117: >
      Anonymous (no login): More controls → Calculator opens the device;
      GCSE paper defaults to fx-83GT CW (level-driven default confirmed).
      HOME menu on 83GT lists Calculate/Statistics/Table/Ratio/Math Box;
      arrow+OK navigation is device-true (direct clicks do NOT launch —
      the OK-dial flow is required); Ratio launches to the staged-rollout
      notice 'This app isn't on the simulator yet.'; the settings dialog
      is a numbered device-true list (1 Input/Output MathI/MathO,
      2 Angle Unit Degree, 3 Number Format Norm 2, 4 Fraction Result
      Improp Fraction, …); the persisted state
      localStorage['genie-calculator-v1'] = {v 1, settings {io
      mathI/mathO, angle deg, numberFormat {kind norm, variant 2},
      fraction improper, decimalMark dot, digitSeparator true},
      variables {}, ans null, functions {f null, g null}} — settings
      survive reloads AND are shared across model switches; a companion
      key win/genie-calculator-popup {isMinimized false} persists the
      popup state. Screenshot evidence: download/mg-classwiz-anonymous-
      evidence.png (fx-83GT CW layout, full CW shell). Statististics/
      Table app screens were not captured (cursor state machine resists
      blind automation) — the registry marks them ENABLED; their screen
      design remains open for the implementation run to probe interactively.
  acceptance_pins:
    - "(spec pin — shell posture, phase A) our overlay gains the CW shell without losing the classic keypad: HOME (app grid), SETTINGS (numbered dialog), CATALOG, TOOLS, VARIABLE ⇄x, FUNCTION f(x), QR (display-only, device-true), OK-dial (▲▼◀▶ + OK) driving app/menu navigation, EXE as the device-true equals, and the A–F variable store keys with x⁻¹/³√ column — the existing 5-column layout remains reachable via the classic/compact toggle so nothing regresses for current users"
    - "(spec pin — model picker, phase A) a 'Calculator model' picker in the overlay header offering fx-83GT CW / fx-85GT CW / fx-991 CW with a 'Not affiliated with Casio'-style disclaimer, defaulting BY THE PAPER'S LEVEL exactly as MG does (gcse/ks2 → fx-83GT CW; a-level/as-level/igcse/international → fx-991 CW), manual override persisted; per-model skin (shift color blue/gold, solar panel), app mask, shift legends and feature flags drive the whole keypad from ONE registry in our code"
    - "(spec pin — settings model, phase B) the numbered settings dialog writes a persisted state shaped like MG's (io mathI/DecimalI, angle deg/rad/gra, numberFormat norm1/norm2/fix/sci, fraction improper/mixed, decimalMark dot/comma, digitSeparator on/off, variables store, ans, f/g slots) — localStorage versioned, surviving reloads, shared across model switches; Fix/Sci wiring also CLOSES the T-MG-CALC-1 FIX-vs-exact deviation (FIX overrides exact-fraction display)"
    - "(spec pin — catalog, phase B) CATALOG exposes the 7 device-true categories (trig, angle, function-analysis, numeric, probability, statistics, other) with the device's function inventory per category; catalog insertion obeys the mathI auto-close laws already in calc-engine"
    - "(spec pin — apps, phase C, exam-honest scope) Statistics (1-variable/2-variable lists + summary stats) and Table (f(x)/g(x) generation) are the ONLY apps shipped — matching MG's enabled set exactly; every other registered app renders the staged-rollout notice pattern ('This app isn't on the simulator yet.') which doubles as the exam-honest fence; f/g slots feed the Table app and the FUNCTION key"
    - "(spec pin — shift legends, phase B, pairs with T-MG-CALC-1) per-model shift legends come from the registry: on fx-83GT CW, SHIFT+x² inserts the recurring-decimal entry (■̇ glyph with cw-recur-digit rendering) and SHIFT+( / SHIFT+×10^e follow the 83GT device sheet; on fx-991 CW, SHIFT+x² = log, SHIFT+( = =, SHIFT+×10^e = i with complex numbers enabled (a+bi / r∠θ via the settings io) — the one-shot consume law from T-MG-CALC-1 is preserved"
    - "(spec pin — error hints, phase B) every Math/Syntax/Stack/Argument/Range ERROR renders a hint line under the message (the .cw-error-hint pattern) using the device's hint text where known"
    - "(regression pin) the T-MG-CALC-1 battery (scripts/mg-calc-battery.js + battery2/3/4) stays green through every phase; the z-law, gesture relay, copy affordance and split-view spanning are byte-identical in behaviour; the FIX-vs-exact and structural-SHIFT fixes from T-MG-CALC-1 land BEFORE phase A"
    - "(fence pin) zero contracts/api/db bytes; no paid-tier or account gating added to the calculator (MG ships it anonymous — ours stays inside the viewer's existing gate, nothing stricter); no spreadsheet/matrix/vector/baseN/inequality/distribution app surfaces (out of the exam class even on 991CW); no physical-keyboard mapping without the T-MG-CALC-1 open-question ruling"
  non_goals:
    - "no pixel-perfect MG clone — our visual identity stays; the CHASE is depth (shell/settings/catalog/apps/picker), not cosmetics"
    - "no engine rewrite: the exact-rational BigInt engine is AHEAD of MG's (our S⇔D exact law passed their device class battery) — the shell wraps it, it does not replace it"
    - "no graphing/CAS (out of class for all three models)"
    - "no implementation in this card — T-MG-CALC-2 is the map + spec; implementation runs get their own cards per phase with the operator's sequencing"
