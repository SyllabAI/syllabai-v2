  parent: T-MG-MARK-PARITY-1
  id_note: >
    Second T-MG-CALC card — the chase card. T-MG-CALC-1 proved the
    negative finding wrong and pinned MG parity as an open question; the
    operator then ruled to chase the full depth. This card holds the
    complete extracted feature map (the evidence) and the parity spec
    (the pins). Implementation ordering: T-MG-CALC-1's two fidelity
    fixes (FIX-vs-exact, structural SHIFT remaps) land FIRST — the shell
    work builds on the corrected base.
  what_it_is: >
    The chase: MG's emulator (chunk 2m9-y4bg7mmjk.js ≈ 2.67 MB pure JS,
    no wasm — an in-house, DOM-native, skin-driven ClassWiz simulator)
    is the second reference implementation for our overlay. Its complete
    observable feature set is mapped below in evidence_map. The parity
    spec targets: (A) the CW device shell — HOME app grid, OK-dial
    navigation, SETTINGS numbered dialog, CATALOG, TOOLS, QR, VARIABLE
    ⇄x, FUNCTION f(x), EXE posture, A–F variable store keys; (B) the
    model picker — fx-83GT CW / fx-85GT CW / fx-991 CW with per-model
    skins (shift color, solar), apps masks, shift legends, feature flags,
    and the LEVEL-DRIVEN DEFAULT (gcse/ks2 → fx-83GT CW; a-level/
    as-level/igcse/international → fx-991 CW); (C) the persisted settings
    model — io mathI/DecimalI, angle deg/rad/gra, numberFormat
    norm1/norm2/fix/sci, fraction improper/mixed, decimalMark dot/comma,
    digitSeparator, variables store, ans, f/g function slots; (D) the
    CATALOG — 7 device-true categories (trig, angle, function-analysis,
    numeric, probability, statistics, other); (E) the apps MG actually
    ENABLES — Calculate, Statistics, Table only (everything else renders
    'This app isn't on the simulator yet.' — their staged rollout is also
    the exam-honest scope: no spreadsheet/matrix/vector/baseN app
    surfaces even on the 991CW skin); (F) per-model shift legends
    (83/85GT: x²-shift → recurring-decimal ■̇ entry; 991CW: x²-shift →
    log, ( -shift → =, d9-shift → i); (G) the error set with HINTS
    (Math/Syntax/Stack/Argument/Range ERROR + .cw-error-hint); (H) the
    popup architecture — minimized-state persistence, shared settings
    across model switches.
  evidence_map:
    bundle_extraction_20261117: >
