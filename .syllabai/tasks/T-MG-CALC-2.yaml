    = =, SHIFT+×10^e = i with complex numbers enabled (a+bi / r∠θ via the settings io) — the one-shot
    consume law from T-MG-CALC-1 is preserved'
  - (spec pin — error hints, phase B) every Math/Syntax/Stack/Argument/Range ERROR renders a hint line
    under the message (the .cw-error-hint pattern) using the device's hint text where known
  - (regression pin) the T-MG-CALC-1 battery (scripts/mg-calc-battery.js + battery2/3/4) stays green through
    every phase; the z-law, gesture relay, copy affordance and split-view spanning are byte-identical
    in behaviour; the FIX-vs-exact and structural-SHIFT fixes from T-MG-CALC-1 land BEFORE phase A
  - (fence pin) zero contracts/api/db bytes; no paid-tier or account gating added to the calculator (MG
    ships it anonymous — ours stays inside the viewer's existing gate, nothing stricter); no spreadsheet/matrix/vector/baseN/inequality/distribution
    app surfaces (out of the exam class even on 991CW); no physical-keyboard mapping without the T-MG-CALC-1
    open-question ruling
