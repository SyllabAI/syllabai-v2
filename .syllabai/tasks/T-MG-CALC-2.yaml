      registry lives in the viewer route chunks, the engine in the lazy
      chunk): model registry 'fx-83gt-cw' {label 'fx-83GT CW',
      skin {shiftColor blue, solar false}, apps l, shiftOverrides
      {sq → {label ■̇, glyph recur, aria 'Recurring decimal'},
