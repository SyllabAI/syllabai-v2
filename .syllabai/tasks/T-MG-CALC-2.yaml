  acceptance_pins:
  - '(spec pin — shell posture, phase A) our overlay gains the CW shell without losing the classic keypad:
    HOME (app grid), SETTINGS (numbered dialog), CATALOG, TOOLS, VARIABLE ⇄x, FUNCTION f(x), QR (display-only,
    device-true), OK-dial (▲▼◀▶ + OK) driving app/menu navigation, EXE as the device-true equals, and
    the A–F variable store keys with x⁻¹/³√ column — the existing 5-column layout remains reachable via
    the classic/compact toggle so nothing regresses for current users'
  - (spec pin — model picker, phase A) a 'Calculator model' picker in the overlay header offering fx-83GT
    CW / fx-85GT CW / fx-991 CW with a 'Not affiliated with Casio'-style disclaimer, defaulting BY THE
    PAPER'S LEVEL exactly as MG does (gcse/ks2 → fx-83GT CW; a-level/as-level/igcse/international → fx-991
    CW), manual override persisted; per-model skin (shift color blue/gold, solar panel), app mask, shift
    legends and feature flags drive the whole keypad from ONE registry in our code
  - (spec pin — settings model, phase B) the numbered settings dialog writes a persisted state shaped
    like MG's (io mathI/DecimalI, angle deg/rad/gra, numberFormat norm1/norm2/fix/sci, fraction improper/mixed,
    decimalMark dot/comma, digitSeparator on/off, variables store, ans, f/g slots) — localStorage versioned,
    surviving reloads, shared across model switches; Fix/Sci wiring also CLOSES the T-MG-CALC-1 FIX-vs-exact
    deviation (FIX overrides exact-fraction display)
  - (spec pin — catalog, phase B) CATALOG exposes the 7 device-true categories (trig, angle, function-analysis,
    numeric, probability, statistics, other) with the device's function inventory per category; catalog
    insertion obeys the mathI auto-close laws already in calc-engine
  - (spec pin — apps, phase C, exam-honest scope) Statistics (1-variable/2-variable lists + summary stats)
    and Table (f(x)/g(x) generation) are the ONLY apps shipped — matching MG's enabled set exactly; every
    other registered app renders the staged-rollout notice pattern ('This app isn't on the simulator yet.')
    which doubles as the exam-honest fence; f/g slots feed the Table app and the FUNCTION key
  - '(spec pin — shift legends, phase B, pairs with T-MG-CALC-1) per-model shift legends come from the
