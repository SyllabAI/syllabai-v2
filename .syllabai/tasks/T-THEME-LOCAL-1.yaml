  notes: 'Operator order of record (2026-11-07, live two-account experiment
    on www.syllab-ai.com: student {quiet-green,dark} vs teacher
    {candy-shop,dark} held simultaneously via PUT /api/v1/me/documents/theme)
    — "Theme must be browser saved only". The revert is the exact mirror of
    the sweep''s own migration laws: the sweep adopted the device key once
    into the account (no-data-loss clause) and retired the device key once
    clean; the revert adopts the account doc once into the device (only when
    the device holds no record of its own — device wins) and retires the
    account copy with one honest-null PUT. The workspace-document vocabulary
    keeps "theme" so existing rows stay readable and GET never 400s; the row
    converges to the honest null after each account''s first post-revert
    login.'
