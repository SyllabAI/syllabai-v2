  band: T-THEME-LOCAL-1 (theme device-locality revert)
  wave: hub-prefs
  deps: []
  scope:
    allowed:
    - apps/hub/src/lib/theme-store.ts (the theme is a browser record again —
      localStorage["syllabai-theme"] is the primary store; one-time
      account-doc adoption for the sweep's existing rows, then one null PUT
      retires the account copy; deliberately NOT wired to
      onAccountDocsReset — sign-out/account switches never clear it)
    - apps/hub/src/app/layout.tsx (the inline bootstrap reads
