      single retirement PUT)
    - .syllabai/tasks/T-THEME-LOCAL-1.yaml + .syllabai/receipts/T-THEME-LOCAL-1/**
      + worklog.md (append-only)
    forbidden:
    - every OTHER pref store stays an account doc (cla-panel-mode,
      dashboard-prefs, course-shell-prefs, teacher-shell-prefs, tutor-prefs,
      pdf-viewer-prefs, note-scroll:<slug>, progress:<slug> — the operator
      order named the THEME only)
    - packages/contracts/** (the "theme" key STAYS in the workspace-document
      vocabulary — existing rows must stay readable for the one-time
      adoption and the GET plane must never 400 on legacy rows)
    - apps/api/**, packages/db/**, the account-docs engine bytes
      (apps/hub/src/lib/account-docs.ts + account-stores.ts)
