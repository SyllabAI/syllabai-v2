task:
  id: T-MIG-048
  title: "Neon-branch fail-path artifact redaction — N-A closure: error text reaching PUBLIC CI logs must never embed raw control-plane bodies or credential-shaped material"
  owner: "r0s (Super Z, zai-web session web-752465e5-2985-476b-86a3-0bf785493dc5) — filed+self-executed as the R0 housekeeping lane under the operator's standing 'review+merge yourself / continue working' delegation (trace 1a10d35bead06d61); single-tool-file scope per the T-MIG-046 precedent"
  status: IN_REVIEW
  priority: P1 # pre-first-dispatch fix required — the daily 02:30 UTC schedule runs this tool; every fail-path emission is public
  wave: 4 # register/CI-adjacent; blocks nothing in the port lanes
  deps: [T-MIG-044, T-MIG-046]
  execution_record: >
    (claim entry 2026-10-06) Found during the round-8 stand-in review
    (pre-compaction, finding N-A) and re-verified @ 08f104d this session:
    three fail-path sites embedded up to 400 chars of raw control-plane
    response body into Error messages — create (seed+prod) and role-create —
    and the create() catch re-emitted whatever the message carried into
    console.error, i.e. PUBLIC Actions logs; on a prod-posture failure this
    can include project/org identifiers and, for the catch path, anything a
    non-Error throw stringified. The console-mirror fallback makes
    non-Neon-shaped bodies more likely, and the 422 BRANCHES_LIMIT_EXCEEDED
    posture (register item 1) makes a prod create-failure the EXPECTED path
    until capacity is freed — the redaction must land before the next
    dispatch. FIX (R-048-A): redactBody() reduces bodies to the honest
    actionable parts (Neon JSON message field or byte size; '<empty body>'
    for empties) and scrub() strips credential-shaped patterns
    (postgres:// URIs with embedded passwords, JWTs, token/secret/key
    assignments, emails) with a 400-cap; applied at all three body sites +
    the catch re-emission + the unreachable-base log (defense-in-depth).
    Status codes stay verbatim; NO behavior change on success paths; drop
    mode and the 404-verify law untouched; workflow interface keys
    unchanged. GATES: typecheck x4; bun test baseline-exact; golden
    --selftest OK; usage-path smoke + a redaction unit proof executed live
    in the receipt.
  cross_slice_contract: >
    CONSUMES: T-MIG-046's base-fallback + role-create surface (unchanged).
    PROVIDES: an honest-failure posture — operators reading a failed run see
    status + Neon's message field, never raw bodies; no secret-shaped text
    can traverse the fail path.
