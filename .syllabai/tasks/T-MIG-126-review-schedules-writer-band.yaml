    (2) THE PASS — page skill_states with last_practiced_at < now −
    idleGracePeriod (default 2d), page size 500, ORDER BY last_practiced_at ASC,
    id ASC (stable/deterministic, defensive since ADR-031). (3) PER STATE —
    effective = decayed(P0, lastPracticedAt, now, params) recomputed from the
    STORED anchor, NEVER written back (ADR-031; the S1 compounding bug :149-159
    is the anchor law's witness); decayed++ when effective < P0 (materially
    decayed) + DecayAppliedEvent; reviewThresholdCrossed = effective <
    params.reviewBelow() (STRICT <, paper default 0.6). (4) THE WRITE (this
    band) — crossed AND NOT existsByLearnerIdAndNodeIdAndStatus(learner, node,
    PENDING) (:172-182) -> INSERT ReviewSchedule(learnerId, nodeId, dueAt=now,
    reason=DECAY_CROSSED_THRESHOLD, masteryAtTrigger=effective) +
    ReviewScheduledEvent; reviewsScheduled++. (5) ROW SHAPE — ReviewSchedule.java
    :18-84: uuid id, learner_id, node_id, due_at, reason enum,
    mastery_at_trigger double nullable (research traceability), status default
    PENDING, created_at; the frozen job's ONLY writes are the ledger row + review
    inserts (C-4 narrowed by ADR-031) — it NEVER writes skill_states, so the port
    touches NOTHING the v2 read-time decay architecture owns.
    THE MATH (EbbinghausDecayService :29-48 + DecayParams.paperDefaults):
    P(t) = P0 · e^(−t/τ), τ banded ON THE PASSED P0 (30/90/365d at 0.45/0.8),
    floor 0.1 (= BKT L0), needsReview = strict < 0.6; v2's canonical owner is
