  status: DONE # R0 flip (session web-df0238cc): merged via PR #13 (URL-dispatched db drivers + latent neon-http 1.x incompatibility pinned 0.10.2 — substrate bug independently verified against drizzle 0.38.4 call form; users.ts OUT-OF-FENCE dispatch ratified); Wave-2 replay unblocked
