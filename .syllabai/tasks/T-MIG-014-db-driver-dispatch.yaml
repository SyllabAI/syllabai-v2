task:
  id: T-MIG-014
  title: "URL-dispatched db driver — postgres.js for non-Neon Postgres so golden replay can target seed-shaped local/branch state (packages/db + identity createSql)"
  owner: "superz-agent-b (session web-06433aa8-e5f9-4e9b-9519-db4ca339d2a9, self-selected per briefing §5 blank-role protocol)"
  status: CLAIMED # 2026-10-05T11:08:05+06:00 (commit = branch start, protocol §2.1)
  claimed_at: "2026-10-05T11:08:05+06:00"
  priority: P1
  wave: 0
  deps: []
  execution_record: |
    CLAIM NOTE + FILING RATIONALE (2026-10-05, pre-work): task filed by the
    claiming agent — no yaml existed for it. Problem: golden-master replay
    (GOLDEN_MASTER §4 gate semantics) needs a target api whose db state MATCHES
    the capture state. The T-MIG-004 content cases are pinned to the Flyway
    V1..V63 SEED state (empty documents/exam_papers/questions/question_assets;
    fixed-uuid curriculum skeleton) — a production-copy Neon branch carries REAL
    pilot data (91 papers, 2,333 chunks, real documents) and would produce
    GENUINE-FAIL class diffs on every state-dependent case (teacher-empty-200 [],
    documents list, review queues), drowning the parity signal in environment
    noise. Today the ONLY db driver in the monorepo is Neon-specific
    (@neondatabase/serverless ws Client in identity createSql; neon-http drizzle
    in packages/db) — neither can reach a local/CI Postgres, so no seed-shaped
    replay environment is reachable by any lane. Fix: URL-dispatched driver —
    DATABASE_URL host *.neon.tech keeps the existing Neon drivers (behaviour
    byte-identical), ANY other Postgres host gets postgres.js (TCP, drizzle's
    standard local driver, also Neon-capable). Fail-fast guards preserved
    verbatim (blank URL, jdbc: prefix). Neon branch row-writes for replay env
    reset remain rows-only per BASELINE_DB §4.1 — never structure, never main.
    FENCE DISCLOSURE (for R0 arbitration, §3.3/§6.1 precedent T-MIG-010
    OUT-OF-FENCE wiring): (1) apps/api/src/services/identity/users.ts
    createSql() gains the same host-based driver dispatch — the file sits in
    T-MIG-010's DONE fence; the change is a contained driver adapter, zero
    behaviour change on Neon, shipped as a separate commit for ratification;
    PR #12 (T-MIG-013) does not touch users.ts (verified via PR files API —
    no collision). (2) root bun.lock updates are the mechanical consequence of
    adding the postgres dependency to packages/db; T-MIG-000 (lock owner) is
    DONE and merged, so the lockfile is live infrastructure now. (3) Neon
    scratch branch t-mig-014/r3a created via console.neon.tech (rows-only
    verification of both driver paths; no production contact).
