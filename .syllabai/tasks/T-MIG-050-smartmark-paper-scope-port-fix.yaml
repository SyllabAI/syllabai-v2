  execution_record: >
    FINDING (T-MIG-047 run-001/run-002, live replay evidence): the v2 port
    selects attempts.exam_paper_id — a column that DOES NOT EXIST in the
    live baseline (packages/db/src/schema/schema.ts:205 — attempts carries
    id, learner_id, question_id, chosen_option_id, correct, marks_awarded,
    response_time_ms, confidence_level, self_doubt_flag, timed_condition,
    provenance, created_at, marking_state, evidence_emitted). Postgres
    raises 42703 (undefined column) at the FIRST smart-mark call; boot log
    proves it live (boot-seed.log); stub-SQL tests are structurally blind
    (the stub does not validate column names). FROZEN DERIVATION (read at
    syllabai-core @ 6cad6ef): SmartMarkService.java :139/:236 and
    StudentSmartMarkService.java :163 call kappaGatePassed(
    question.examPaperId()) where question = attempt.question() — paper
    scope comes from the QUESTION joined via attempts.question_id, never
    from the attempt row; kappaGatePassed (:333-345) treats a null paper id
    as "paper gate false, global gate still decides" — the TS
    kappaGatePassed already reproduces exactly that null law, so only the
    derivation source is wrong. DEFECT SURFACE (bounded by grep of every
    "from attempts" select + every exam_paper_id reference in apps/api):
    smartmark/index.ts markAttempt :492, loadOwnedAttempt :739,
    loadFeedbackSource :797 (three selects carrying the phantom column;
    the field IS consumed at :553 and :696); teachermarking/index.ts
    markAnswer :492 and recordHumanMark :717 (same phantom column in the
    lock select, but the attempt-sourced field is NEVER read — paper scope
    there already comes from the questions join at :501/:726 and is
    consumed at :583, which is frozen-faithful). All other exam_paper_id
    references in apps/api (assessment/submit, exam-papers/papers,
    questions/servable, content/review-repos, assessment/history,
    learner/state, selfmark) read questions.exam_paper_id or select
    unrelated columns — verified clean. FIX (R-050-A): smartmark — the
    three attempt-row selects derive paper scope with
    "join questions q on q.id = a.question_id" selecting q.exam_paper_id
    (attempt row aliased a; FOR UPDATE qualified as "for update of a" so
    the lock surface stays byte-equivalent to the frozen core, which locks
    only the attempt — the question read is unlocked); AttemptLockRow
    exam_paper_id documented as join-derived. teachermarking — drop the
    phantom column from the two lock selects and from the AttemptLockRow
    interface (field unconsumed; zero behavior surface). NO zod/schema
    edits, NO golden corpus or comparator contact, NO workflow interface
    key changes, NO drizzle schema changes (the baseline is correct; the
    PORT was wrong). Success-path SQL for every other statement untouched.
    AMENDMENT (2026-10-06, pre-push): the fake-SQL test router routes by
    exact normalized query text and throws 'unexpected query' on any
    unmatched statement — the 15 smartmark-family tests fail on the NEW
    join text until their route regexes are updated. Two fixture files
    added to scope.allowed above (regex/comment lines only; ATTEMPT_ROW /
    ATTEMPT row fixtures are byte-unchanged — exam_paper_id: PAPER_ID now
    represents the question's paper reached through the join). Fence
    amendment disclosed here BEFORE push; no other test file references
    the old select text (verified by grep across apps/api/test).
  cross_slice_contract: >
