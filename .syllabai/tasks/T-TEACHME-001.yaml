  research: 'LIVE PROBE OF RECORD (2026-10-31, operator-owned MathsGenie account, one free session spent; evidence
    pack download/mg-probe/ — PROBE-FINDINGS.md + 10 screenshots): the original is a 4-step wizard — topics (up
    to 3 from a grade-banded spec tree, or "describe your own") → pupil difficulty (Easy "knows nothing" / Medium
    "knows the basics but mixes things up" / Hard "gets the basics and grills you on the tricky parts") → session
    length (Quick Review = 3 objectives / In-Depth = 4) → mode (Chat / Voice "New"). Auto-generated per-topic learning
    objectives carry status + topic tag and TICK OFF AUTOMATICALLY when the student''s explanation covers them —
    no mid-session scoring screen. The pupil''s probe pattern is stable across all 4 exchanges: paraphrase its updated
    understanding back, then ask the next edge-case question (carrying when a 9 rounds up; leading zeros in 0.004728;
    dp-vs-sf discrimination). Each student message gets an expandable verdict chip (observed "Great") holding an
    extractive Feedback line naming the covered learning point. THE PERSONA NEVER BREAKS CHARACTER: when the student
    made a real error (2nd decimal place of 0.004728 miscounted as 7), Baby Genie said "okay, that clicks, thanks!"
    — the correction appears only in the post-session review ("the digits after the decimal point are 0, 0, 4, 7,
    2, 8, so the 2nd decimal digit is 0 and the deciding digit is 4"), alongside 3 quoted Strengths and Suggested
    Practice items that link REAL platform resources (Rounding · Question Bank / Notes). End of session: "Generating
    session review…" (async) → review card → NPS survey; session permalink URL; landing keeps a history list (Today
    · Maths · 4m ago · Completed). METERING OF RECORD: Teach Genie is NOT Energy-metered (Ask Genie and AI marking
    are; XP 3 / energy 11 / streak 2 all unchanged after a full session) — it is a separate "2 free sessions" lifetime
    meter, then a hard paywall ("Go unlimited with Pro", 40%-off countdown, 12/3/1-month plans, "Most popular" pre-selected).
    Unprobed (free quota consumed by an accidental no-topic start that fell back to a suggested osmosis topic):
    weak/vague-explanation gating, review response to a fully wrong explanation, Ask-for-help behaviour, Voice mode,
    attachments (disabled on free).

    '
  notes: 'NAME: feature working title "Teach-Me" (the original''s "Teach Genie"/"Baby Genie" branding is theirs;
    pupil persona name is an operator ruling — open_questions Q1). SYLLABAI TWISTS over the original, all native
    to our corpus: (1) objectives are drawn from the CANONICAL SPEC TREE (picker ≤3 spec points, MG ≤3 topics) and
    each objective records the spec-point ids it covers; (2) probe targets come from the spec-point registry, so
    the review card can render per-spec-point verdicts, not just prose; (3) misconception mining: the review judge
    ALSO classifies wrong-but-confident statements against the misconception registry into a candidate queue (BDT
    evidence class, AI_SUGGESTED, never auto-promoted); (4) exam anchoring: "where would this show up in an exam?"
    attaches a REAL past-paper part from the serving corpus for the pilot course instead of a hypothetical; (5)
    KG closure: the review surfaces prerequisite warnings from the T-C11 graph when a taught point has a weak prerequisite;
    (6) suggested practice links the course''s real question-bank sets and revision notes. EVIDENCE HONESTY: teach-session
    evidence is a NEW evidence kind TEACH_SESSION, append-only, tier AI_SUGGESTED, NEVER mutating of-record mastery;
    teacher ratification rides the existing workbench staged-decision pattern. In-session correction policy is an
    operator ruling (open_questions Q3): option A = MG-faithful (persona never breaks character; review discloses
    — recommended for run-1, simplest, and the review-of-record already carries the correction); option B = fail-loud
    (persona disengages and labels the statement a misconception in-session). ANTIGAMING: min-word floor + verbatim-overlap
    check against the course''s revision-note corpus (pasted-note detection, deterministic, fail-closed to "not
    covered") + cross-session dedupe per (student, spec point). COST: 5–7 LLM turns per session on the existing
    LlmProvider free chain (Groq → Gemini → OpenRouter failover, T-023 lineage) — coverage judge and review generator
    are separate pinned prompts v1 with fixture replay in CI; per-session token ceiling asserted in tests. GATES:
    bun test + tsc --noEmit + eslint on touched files; behavioural gate on all LLM output (T-MIG-039 law); zod-strict
    contracts; flags.json gate teachMe (pilot igcse-chemistry-19, honest roadmap state elsewhere); receipt under
    .syllabai/receipts/T-TEACHME-001/.

    '
