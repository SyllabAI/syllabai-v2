    doctrine: A = persona never breaks character, review discloses (MG-faithful, recommended v1) vs B = fail-loud
    in-session. Paper B note: option A leaves a window where a student is congratulated for wrong teaching — if
    the pilot measures it, the disclosure timing becomes a research finding, which is exactly the kind of pre-registered
    comparison Paper B wants. Q4 cost ceiling: max LLM turns/session and daily per-student session cap on the free
    chain (original: 2 sessions lifetime free, unmetered energy — we must pick our own quota law before exposing
    to pilot students). Q5 anti-gaming constants (min words, overlap threshold) — provisional defaults in run-002
    tests pending the vague-explanation re-probe.

