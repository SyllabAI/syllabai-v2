rulings: 'Q1: feature name "Teach-Me"; pupil character "the Pupil" (simple avatar, NO custom mascot art in v1; revisit
  after pilot feedback). Q2: ADR-040 SIGNED OFF — new evidence kind TEACH_SESSION, tier AI_SUGGESTED, append-only;
  never mutates of-record mastery; teacher ratification in the workbench is the only path to record status. Q3:
  Option A (MG-faithful) + one guardrail — the persona never breaks character in-session; the pupil NEVER actively
  confirms a statement that contradicts course canon (on contradiction it stays in character and expresses confusion,
