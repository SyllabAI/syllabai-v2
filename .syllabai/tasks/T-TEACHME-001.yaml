rulings: 'Q1: feature name "Teach-Me"; pupil character "the Pupil" (simple avatar, NO custom mascot art in v1; revisit
  after pilot feedback). Q2: ADR-040 SIGNED OFF — new evidence kind TEACH_SESSION, tier AI_SUGGESTED, append-only;
  never mutates of-record mastery; teacher ratification in the workbench is the only path to record status. Q3:
  Option A (MG-faithful) + one guardrail — the persona never breaks character in-session; the pupil NEVER actively
  confirms a statement that contradicts course canon (on contradiction it stays in character and expresses confusion,
  e.g. "wait, that doesn''t match the example you gave me…?"); full correction stays in the review card. A-vs-B
  disclosure timing pre-registered in Paper B as a researchable comparison. Q4: quota law — 3 sessions/student/day
  during the pilot; Quick = 3 objectives / In-Depth = 4 (original-faithful); hard per-session LLM-call and token
  ceilings asserted in tests; monitored by the existing quota sentinel; NO lifetime meter (the original''s "2 free
  sessions" is a monetization wall — ours is cost protection under the $0/no-card doctrine). Q5: anti-gaming defaults,
  provisional until the vague-explanation re-probe, all in ONE config object so the re-probe can retune without
  code changes: min 40 words per explanation message for coverage credit (sub-floor → in-character nudge, no chip);
  verbatim-overlap flag at 80% vs the course''s revision-note corpus → fail-closed "objective not covered"; no repeat
  coverage credit per (student, spec point) within 7 days (session-local ticks unaffected). SCOPE (same message:
  "for all subjects? or the pilot 4ch1 first?"): build is subject-agnostic from day one (spec-point-keyed, course_id
  is data not code); rollout is gated per course by content prerequisites — Wave 0 = 4CH1 pilot (igcse-chemistry-19),
  Wave 1 = courses passing the content gate (spec tree + indexed notes corpus + question-bank links), Wave 2 = all
  subjects. See TEACH_ME_PLAN.md §1.

  '
