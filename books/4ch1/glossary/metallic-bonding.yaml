# books/4ch1 glossary - AUTHORED layer of record (T-BOOK-016, pack c09 refs)
subject_code: "4ch1"
terms:
  - term: "metallic bond"
    slug: metallic-bond
    definition: "The electrostatic attraction between a lattice of positive metal ions and the surrounding delocalised electrons."
    ms_accepts: ["electrostatic attraction between positive ions and delocalised electrons"]
    ms_avoids: ["free electrons", "sea of electrons (unqualified)", "ionic bond between metal atoms"]
    aliases: []
    source: "authored:pack-c06-c10-r0"
  - term: "delocalised electrons"
    slug: delocalised-electrons
    definition: "Outer-shell electrons that are no longer attached to any one atom and can move through the whole metallic lattice."
    ms_accepts: ["electrons free to move through the lattice", "shared across the whole structure"]
    ms_avoids: ["free electrons (unqualified - say delocalised)"]
    aliases: []
    source: "authored:pack-c06-c10-r0"
  - term: "malleable"
    slug: malleable
    definition: "Can be hammered into shape: in metals the layers of ions can slide over each other without breaking the metallic bonding."
    ms_accepts: ["layers slide over each other", "hammered into shape"]
    ms_avoids: ["soft (metals are not soft because bonds are weak - they are high-melting)"]
    aliases: ["ductile (drawn into wires)"]
    source: "authored:pack-c06-c10-r0"
