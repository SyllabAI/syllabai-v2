# books/4ch1 glossary - AUTHORED layer of record (T-BOOK-016, pack c10 refs)
subject_code: "4ch1"
terms:
  - term: "electrolysis"
    slug: electrolysis
    definition: "Decomposition of an electrolyte by passing an electric current through it (molten or aqueous)."
    ms_accepts: ["decomposition by electricity", "of a molten or aqueous ionic compound"]
    ms_avoids: ["splitting any liquid (solid ionic compounds do not electrolyse)"]
    aliases: []
    source: "authored:pack-c06-c10-r0"
  - term: "electrolyte"
    slug: electrolyte
    definition: "The molten or dissolved ionic compound whose ions carry the current during electrolysis."
    ms_accepts: ["molten or aqueous ionic compound", "ions free to move"]
    ms_avoids: ["the wires or electrodes"]
    aliases: []
    source: "authored:pack-c06-c10-r0"
  - term: "electrode"
    slug: electrode
    definition: "The conductor (often inert carbon or platinum) dipped into the electrolyte where ions discharge."
    ms_accepts: ["conductor where ions are discharged", "inert carbon or platinum in the exam practicals"]
    ms_avoids: ["the power supply itself"]
    aliases: []
    source: "authored:pack-c06-c10-r0"
  - term: "anode"
    slug: anode
    definition: "The positive electrode - it attracts anions (PANiC)."
    ms_accepts: ["positive electrode", "attracts anions"]
    ms_avoids: ["negative electrode"]
    aliases: []
    source: "authored:pack-c06-c10-r0"
  - term: "cathode"
    slug: cathode
    definition: "The negative electrode - it attracts cations (PANiC)."
    ms_accepts: ["negative electrode", "attracts cations"]
    ms_avoids: ["positive electrode"]
    aliases: []
    source: "authored:pack-c06-c10-r0"
  - term: "anion"
    slug: anion
    definition: "A negative ion - it migrates to the anode during electrolysis."
    ms_accepts: ["negative ion", "goes to the anode"]
    ms_avoids: ["positive ion"]
    aliases: []
    source: "authored:pack-c06-c10-r0"
  - term: "cation"
    slug: cation
    definition: "A positive ion - it migrates to the cathode during electrolysis."
    ms_accepts: ["positive ion", "goes to the cathode"]
    ms_avoids: ["negative ion"]
    aliases: []
    source: "authored:pack-c06-c10-r0"
  - term: "half-equation"
    slug: half-equation
    definition: "The ionic equation for one electrode's reaction, with electrons shown on the reactant side (reduction) or product side (oxidation)."
    ms_accepts: ["electrode reaction with electrons shown", "charge must balance as well as atoms"]
    ms_avoids: ["electrons on both sides"]
    aliases: ["ionic half-equation"]
    source: "authored:pack-c06-c10-r0"
  - term: "molten"
    slug: molten
    definition: "Melted - a solid ionic compound heated until liquid, so its ions are free to move and it conducts."
    ms_accepts: ["the melted (liquid) state of the salt", "ions free to move"]
    ms_avoids: ["dissolved in water (that is aqueous)"]
    aliases: []
    source: "authored:pack-c06-c10-r0"
  - term: "oxidation"
    slug: oxidation
    definition: "Loss of electrons (OILRIG) - at the anode during electrolysis, where anions discharge."
    ms_accepts: ["loss of electrons", "occurs at the anode"]
    ms_avoids: ["gaining oxygen only (too narrow for electrolysis answers)"]
    aliases: []
    source: "authored:pack-c06-c10-r0"
  - term: "reduction"
    slug: reduction
    definition: "Gain of electrons (OILRIG) - at the cathode during electrolysis, where cations discharge."
    ms_accepts: ["gain of electrons", "occurs at the cathode"]
    ms_avoids: ["losing oxygen only (too narrow for electrolysis answers)"]
    aliases: []
    source: "authored:pack-c06-c10-r0"
