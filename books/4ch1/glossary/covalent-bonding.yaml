# books/4ch1 glossary - AUTHORED layer of record (T-BOOK-016, pack c08 refs)
subject_code: "4ch1"
terms:
  - term: "covalent bond"
    slug: covalent-bond
    definition: "A bond formed when atoms share a pair of electrons; the shared pair is attracted to both nuclei."
    ms_accepts: ["shared pair of electrons", "electrostatic attraction between shared pair and both nuclei"]
    ms_avoids: ["transfer of electrons (that is ionic)", "free electrons", "sea of electrons"]
    aliases: []
    source: "authored:pack-c06-c10-r0"
  - term: "simple molecular structure"
    slug: simple-molecular-structure
    definition: "Small discrete molecules with strong covalent bonds inside but weak intermolecular forces between them - low melting and boiling points."
    ms_accepts: ["weak intermolecular forces are overcome, not covalent bonds"]
    ms_avoids: ["covalent bonds break on melting (wrong law)"]
    aliases: ["simple molecules"]
    source: "authored:pack-c06-c10-r0"
  - term: "giant covalent structure"
    slug: giant-covalent-structure
    definition: "A structure in which atoms are joined by covalent bonds throughout the whole network (diamond, graphite, silicon dioxide) - solids with high melting points."
    ms_accepts: ["covalent bonds throughout the whole structure", "many strong bonds must be broken"]
    ms_avoids: ["intermolecular forces (there are no separate molecules)"]
    aliases: ["network covalent"]
    source: "authored:pack-c06-c10-r0"
  - term: "intermolecular forces"
    slug: intermolecular-forces
    definition: "The weak forces of attraction between separate molecules; they grow stronger as the molecule gets bigger, raising boiling points."
    ms_accepts: ["weak forces between molecules", "stronger as Mr/molecular size increases"]
    ms_avoids: ["bonds between molecules (they are forces, not bonds)"]
    aliases: []
    source: "authored:pack-c06-c10-r0"
