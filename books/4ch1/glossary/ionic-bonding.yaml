# books/4ch1 glossary - AUTHORED layer of record (T-BOOK-016, pack c07-c08 refs)
subject_code: "4ch1"
terms:
  - term: "ion"
    slug: ion
    definition: "A charged particle formed when an atom loses electrons (positive ion) or gains electrons (negative ion)."
    ms_accepts: ["atom that has lost or gained electrons", "charged particle"]
    ms_avoids: ["atom that shares electrons (that is a molecule)"]
    aliases: []
    source: "authored:pack-c06-c10-r0"
  - term: "ionic bond"
    slug: ionic-bond
    definition: "The strong electrostatic attraction between oppositely charged ions in a compound."
    ms_accepts: ["electrostatic attraction between oppositely charged ions"]
    ms_avoids: ["free electrons", "sea of electrons", "sharing of electrons (that is covalent)"]
    aliases: []
    source: "authored:pack-c06-c10-r0"
  - term: "isoelectronic"
    slug: isoelectronic
    definition: "Having the same electronic configuration - e.g. Na+, Mg2+ and F- all share the neon arrangement."
    ms_accepts: ["same number of electrons", "same electronic configuration"]
    ms_avoids: ["same number of shells only"]
    aliases: []
    source: "authored:pack-c06-c10-r0"
  - term: "dot-and-cross diagram"
    slug: dot-and-cross-diagram
    definition: "A diagram using dots for one atom's outer electrons and crosses for the other's, to show electron transfer (ionic) or sharing (covalent)."
    ms_accepts: ["dots and crosses showing outer-shell electrons", "outer shell only"]
    ms_avoids: ["showing inner shells in the exam answer"]
    aliases: []
    source: "authored:pack-c06-c10-r0"
  - term: "sulfate ion"
    slug: sulfate
    definition: "The SO4 2- ion; the -ate ending signals oxygen present, and the charge is 2-."
    ms_accepts: ["SO4 2-"]
    ms_avoids: ["sulfide (the S 2- ion, no oxygen)"]
    aliases: []
    source: "authored:pack-c06-c10-r0"
  - term: "nitrate ion"
    slug: nitrate
    definition: "The NO3 - ion; -ate with nitrogen and oxygen, charge 1-."
    ms_accepts: ["NO3 -"]
    ms_avoids: ["nitride (the N 3- ion, no oxygen)"]
    aliases: []
    source: "authored:pack-c06-c10-r0"
  - term: "electrostatic attraction"
    slug: electrostatic-attraction
    definition: "The force of attraction between opposite charges - the common law behind ionic, covalent and metallic bonding."
    ms_accepts: ["attraction between opposite charges", "between positive and negative"]
    ms_avoids: ["attraction between like charges"]
    aliases: ["electrostatic(al) forces"]
    source: "authored:pack-c06-c10-r0"
  - term: "giant ionic lattice"
    slug: giant-ionic-lattice
    definition: "The regular 3-D arrangement of oppositely charged ions held by electrostatic attraction throughout the whole structure."
    ms_accepts: ["giant structure of oppositely charged ions", "held throughout by electrostatic forces"]
    ms_avoids: ["molecule of an ionic compound"]
    aliases: []
    source: "authored:pack-c06-c10-r0"
